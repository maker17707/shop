<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rasky Kostanay</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Swiper CSS для 3D-барабана -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-color: #0d0d11;
            --text-color: #ffffff;
            --neon-color: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 20px 0;
        }

        /* Шапка магазина */
        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        header p {
            font-size: 13px;
            color: #8a8a9e;
            margin-top: 4px;
        }

        /* Основной контейнер */
        .step-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
        }

        .step {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 3D Карусель / Барабан */
        .swiper {
            width: 100%;
            padding-top: 20px;
            padding-bottom: 40px;
        }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 260px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        /* Карточка устройства */
        .device-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .device-card img {
            width: 170px;
            height: 210px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .swiper-slide-active .device-card img {
            transform: scale(1.08);
        }

        .device-title {
            margin-top: 15px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .device-puffs {
            margin-top: 4px;
            font-size: 13px;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* Неоновый элемент под барабаном */
        .neon-podium {
            width: 220px;
            height: 15px;
            border-radius: 50%;
            background: var(--neon-color);
            box-shadow: 0 0 25px 8px var(--neon-glow), 0 0 50px 15px var(--neon-glow);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            margin-top: -20px;
            z-index: 2;
        }

        /* Карточка вкуса */
        .flavor-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            width: 80%;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: border-color 0.4s ease;
        }

        .swiper-slide-active .flavor-card {
            border-color: var(--neon-color);
        }

        .flavor-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .flavor-name {
            font-size: 22px;
            font-weight: 700;
        }

        /* Кнопки управления */
        .btn-action {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 15px;
            z-index: 10;
            width: 80%;
            max-width: 300px;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8a8a9e;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rasky Kostanay</h1>
        <p id="step-subtitle">Шаг 1: Выберите устройство</p>
    </header>

    <div class="step-container">
        <!-- ШАГ 1: ВЫБОР УСТРОЙСТВА -->
        <div class="step active" id="step-device">
            <div class="swiper deviceSwiper">
                <div class="swiper-wrapper" id="device-list">
                    <!-- Заполняется динамически через JS -->
                </div>
            </div>
            <button class="btn-action" onclick="confirmDevice()">Выбрать устройство</button>
        </div>

        <!-- ШАГ 2: ВЫБОР ВКУСА -->
        <div class="step" id="step-flavor">
            <button class="btn-back" onclick="goBackToDevices()">← Назад к устройствам</button>
            <div class="swiper flavorSwiper">
                <div class="swiper-wrapper" id="flavor-list">
                    <!-- Заполняется динамически через JS -->
                </div>
            </div>
            <!-- Интеллектуальный неоновый подиум -->
            <div class="neon-podium" id="neon-glow"></div>
            
            <button class="btn-action" id="btn-select-flavor" onclick="confirmFlavor()">Далее</button>
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Данные товаров (с точными именами картинок из вашей папки и количеством затяжек)
        const catalogData = [
            {
                id: 'sopro20000',
                name: 'Vaka SoPro',
                puffs: '20000 затяжек',
                image: 'sopro20000.png',
                flavors: [
                    { name: 'Прохладная Мята', icon: '🌿', color: '#00f3ff', glow: 'rgba(0, 243, 255, 0.8)' },
                    { name: 'Сочный Персик', icon: '🍑', color: '#ff7700', glow: 'rgba(255, 119, 0, 0.8)' },
                    { name: 'Двойное Яблоко', icon: '🍏', color: '#39ff14', glow: 'rgba(57, 255, 20, 0.8)' },
                    { name: 'Клубника Банан', icon: '🍓', color: '#ff0055', glow: 'rgba(255, 0, 85, 0.8)' },
                    { name: 'Черника Лёд', icon: '🫐', color: '#8a2be2', glow: 'rgba(138, 43, 226, 0.8)' }
                ]
            },
            {
                id: 'pa10000',
                name: 'Vaka PA',
                puffs: '10000 затяжек',
                image: 'pa10000.png',
                flavors: [
                    { name: 'Лесные Ягоды', icon: '🫐', color: '#9d00ff', glow: 'rgba(157, 0, 255, 0.8)' },
                    { name: 'Арбузная Свежесть', icon: '🍉', color: '#ff0055', glow: 'rgba(255, 0, 85, 0.8)' },
                    { name: 'Энергетик', icon: '⚡', color: '#ffea00', glow: 'rgba(255, 234, 0, 0.8)' },
                    { name: 'Сладкий Манго', icon: '🥭', color: '#ffaa00', glow: 'rgba(255, 170, 0, 0.8)' }
                ]
            },
            {
                id: 'slim8000',
                name: 'Vaka Slim',
                puffs: '8000 затяжек',
                image: 'slim8000.png',
                flavors: [
                    { name: 'Вишня Лёд', icon: '🍒', color: '#dc143c', glow: 'rgba(220, 20, 60, 0.8)' },
                    { name: 'Виноград', icon: '🍇', color: '#aa00ff', glow: 'rgba(170, 0, 255, 0.8)' },
                    { name: 'Кислый Лимон', icon: '🍋', color: '#ccff00', glow: 'rgba(204, 255, 0, 0.8)' }
                ]
            }
        ];

        let selectedDevice = null;
        let selectedFlavor = null;
        let deviceSwiper = null;
        let flavorSwiper = null;

        // Генерация списка устройств
        function renderDevices() {
            const container = document.getElementById('device-list');
            container.innerHTML = catalogData.map(dev => `
                <div class="swiper-slide">
                    <div class="device-card">
                        <img src="${dev.image}" alt="${dev.name}">
                        <div class="device-title">${dev.name}</div>
                        <div class="device-puffs">${dev.puffs}</div>
                    </div>
                </div>
            `).join('');

            deviceSwiper = new Swiper('.deviceSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: {
                    rotate: 35,
                    stretch: 0,
                    depth: 160,
                    modifier: 1,
                    slideShadows: false,
                },
                on: {
                    slideChange: () => {
                        triggerHaptic();
                    }
                }
            });
        }

        // Генерация списка вкусов
        function renderFlavors(flavors) {
            const container = document.getElementById('flavor-list');
            container.innerHTML = flavors.map(fl => `
                <div class="swiper-slide">
                    <div class="flavor-card">
                        <div class="flavor-icon">${fl.icon}</div>
                        <div class="flavor-name">${fl.name}</div>
                    </div>
                </div>
            `).join('');

            if (flavorSwiper) flavorSwiper.destroy();

            flavorSwiper = new Swiper('.flavorSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: {
                    rotate: 30,
                    stretch: 0,
                    depth: 120,
                    modifier: 1,
                    slideShadows: false,
                },
                on: {
                    init: function () {
                        updateNeonGlow(flavors[this.activeIndex]);
                    },
                    slideChange: function () {
                        triggerHaptic();
                        updateNeonGlow(flavors[this.activeIndex]);
                    }
                }
            });
        }

        // Интеллектуальный неон
        function updateNeonGlow(flavor) {
            if (!flavor) return;
            const podium = document.getElementById('neon-glow');
            podium.style.setProperty('--neon-color', flavor.color);
            podium.style.setProperty('--neon-glow', flavor.glow);
        }

        // Виброотклик
        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        // Переход к выбору вкуса
        function confirmDevice() {
            const activeIndex = deviceSwiper.activeIndex;
            selectedDevice = catalogData[activeIndex];
            
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} (${selectedDevice.puffs})`;
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');

            renderFlavors(selectedDevice.flavors);
        }

        // Возврат к устройствам
        function goBackToDevices() {
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
        }

        // Выбор вкуса
        function confirmFlavor() {
            const activeFlavorIndex = flavorSwiper.activeIndex;
            selectedFlavor = selectedDevice.flavors[activeFlavorIndex];

            alert(`Выбрано:\n📦 ${selectedDevice.name} — ${selectedDevice.puffs}\n🎨 Вкус: ${selectedFlavor.name}`);
        }

        renderDevices();
    </script>
</body>
</html>
