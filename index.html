<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформление заказа</title>
    <!-- Подключение Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f3);
            --card-border: var(--tg-theme-secondary-bg-color, #e4e4e7);
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
        }

        /* Навигация / Шаги */
        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Сетка каталога */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .item-card {
            background-color: var(--secondary-bg-color);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card:active {
            transform: scale(0.97);
        }

        .item-card.selected {
            border-color: var(--button-color);
            background-color: rgba(36, 129, 204, 0.05);
        }

        .item-image-wrapper {
            width: 100%;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--button-color);
        }

        /* Форма заказа */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            margin-bottom: 6px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--secondary-bg-color);
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--button-color);
        }

        .form-textarea {
            resize: none;
            height: 80px;
        }

        /* Кнопки */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .btn-secondary {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        /* Экран успеха / статуса заказа */
        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .success-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .success-desc {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* Лоадер */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--secondary-bg-color);
            border-top: 4px solid var(--button-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Выбранные элементы-сводки */
        .summary-box {
            background-color: var(--secondary-bg-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="main-title">Каталог товаров</h1>
        <div class="subtitle" id="main-subtitle">Выберите устройство для продолжения</div>
    </header>

    <!-- ШАГ 1: ВЫБОР УСТРОЙСТВА -->
    <div id="step-devices" class="step-container active">
        <div id="devices-loader" class="loader-container">
            <div class="spinner"></div>
            <div class="subtitle">Загрузка каталога...</div>
        </div>
        <div class="catalog-grid" id="devices-grid">
            <!-- Динамически заполняется через JS -->
        </div>
    </div>

    <!-- ШАГ 2: ВЫБОР ВКУСА -->
    <div id="step-flavors" class="step-container">
        <div id="flavors-loader" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <div class="subtitle">Загрузка вкусов...</div>
        </div>
        <div class="catalog-grid" id="flavors-grid">
            <!-- Динамически заполняется через JS -->
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="goToStep('devices')">Назад</button>
        </div>
    </div>

    <!-- ШАГ 3: ФОРМА КОНТАКТНЫХ ДАННЫХ -->
    <div id="step-checkout" class="step-container">
        <div class="summary-box" id="order-summary">
            <!-- Сводка выбранного товара -->
        </div>

        <div class="form-group">
            <label class="form-label" for="input-name">Ваше имя</label>
            <input type="text" id="input-name" class="form-input" placeholder="Введите ваше имя">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-phone">Номер телефона</label>
            <input type="tel" id="input-phone" class="form-input" placeholder="+7 (___) ___-__-__">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-address">Адрес доставки</label>
            <input type="text" id="input-address" class="form-input" placeholder="Город, улица, дом, квартира">
        </div>

        <div class="form-group">
            <label class="form-label" for="input-comment">Комментарий к заказу</label>
            <textarea id="input-comment" class="form-textarea" placeholder="Оставьте примечание, если необходимо..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="goToStep('flavors')">Назад</button>
            <button class="btn btn-primary" id="btn-submit-order" onclick="submitOrder()">Оформить</button>
        </div>
    </div>

    <!-- ШАГ 4: УСПЕХ И ОТМЕНА ЗАКАЗА -->
    <div id="step-success" class="step-container">
        <div class="success-screen">
            <div class="success-icon">🎉</div>
            <div class="success-title">Заказ успешно оформлен!</div>
            <div class="success-desc" id="success-desc-text">
                Ваш заказ передан администратору. Мы свяжемся с вами в ближайшее время для подтверждения.
            </div>
            <div class="btn-group" style="flex-direction: column;">
                <button class="btn btn-danger" onclick="cancelOrder()">Отменить заказ</button>
                <button class="btn btn-secondary" onclick="closeWebApp()">Закрыть приложение</button>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Основной URL API (пустая строка означает текущий домен сервера, либо пропишите точный адрес)
        const API_BASE_URL = 'https://tired-experts-repeat.loca.lt';

        // Данные текущего заказа
        let currentOrder = {
            device: null,
            flavor: null
        };

        let createdOrderId = null;

        // Данные каталога в памяти
        let catalogDevices = [];
        let catalogFlavors = {};

        // Управление шагами интерфейса
        function goToStep(stepName) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));

            const titleEl = document.getElementById('main-title');
            const subtitleEl = document.getElementById('main-subtitle');

            if (stepName === 'devices') {
                document.getElementById('step-devices').classList.add('active');
                titleEl.innerText = 'Каталог устройств';
                subtitleEl.innerText = 'Выберите устройство для продолжения';
            } else if (stepName === 'flavors') {
                document.getElementById('step-flavors').classList.add('active');
                titleEl.innerText = 'Выбор вкуса';
                subtitleEl.innerText = currentOrder.device ? currentOrder.device.name : 'Выберите вкус';
            } else if (stepName === 'checkout') {
                document.getElementById('step-checkout').classList.add('active');
                titleEl.innerText = 'Оформление заказа';
                subtitleEl.innerText = 'Укажите контактные данные';
                renderSummary();
            } else if (stepName === 'success') {
                document.getElementById('step-success').classList.add('active');
                titleEl.innerText = 'Заказ принят';
                subtitleEl.innerText = '';
            }
        }

        // Загрузка каталога с сервера
        async function fetchCatalog() {
            const loader = document.getElementById('devices-loader');
            const grid = document.getElementById('devices-grid');
            loader.style.display = 'flex';
            grid.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера при загрузке каталога');
                
                const data = await response.json();
                catalogDevices = data.devices || [];
                catalogFlavors = data.flavors || {};
                
                renderDevices();
            } catch (error) {
                console.error('Ошибка:', error);
                // Запасные тестовые данные на случай отсутствия связи при отладке
                catalogDevices = [
                    { id: 1, name: 'Демо Устройство 1', price: 1500, image: 'https://via.placeholder.com/150' },
                    { id: 2, name: 'Демо Устройство 2', price: 2000, image: 'https://via.placeholder.com/150' }
                ];
                catalogFlavors = {
                    1: [{ id: 101, name: 'Мята' }, { id: 102, name: 'Ягоды' }],
                    2: [{ id: 201, name: 'Манго' }, { id: 202, name: 'Арбуз' }]
                };
                renderDevices();
            } finally {
                loader.style.display = 'none';
            }
        }

        // Рендер списка устройств
        function renderDevices() {
            const grid = document.getElementById('devices-grid');
            grid.innerHTML = '';

            catalogDevices.forEach(device => {
                const card = document.createElement('div');
                card.className = `item-card ${currentOrder.device?.id === device.id ? 'selected' : ''}`;
                card.onclick = () => selectDevice(device);
                
                card.innerHTML = `
                    <div>
                        <div class="item-image-wrapper">
                            <img class="item-image" src="${device.image || 'https://via.placeholder.com/150'}" alt="${device.name}">
                        </div>
                        <div class="item-name">${device.name}</div>
                    </div>
                    <div class="item-price">${device.price} руб.</div>
                `;
                grid.appendChild(card);
            });
        }

        // Выбор устройства
        function selectDevice(device) {
            currentOrder.device = device;
            currentOrder.flavor = null; // Сбрасываем вкус при смене устройства
            renderDevices();
            renderFlavors(device.id);
            goToStep('flavors');
        }

        // Рендер вкусов для устройства
        function renderFlavors(deviceId) {
            const grid = document.getElementById('flavors-grid');
            const loader = document.getElementById('flavors-loader');
            grid.innerHTML = '';
            loader.style.display = 'none';

            const flavors = catalogFlavors[deviceId] || [];
            
            if (flavors.length === 0) {
                grid.innerHTML = '<div class="subtitle" style="grid-column: span 2; text-align: center;">Нет доступных вкусов</div>';
                return;
            }

            flavors.forEach(flavor => {
                const card = document.createElement('div');
                card.className = `item-card ${currentOrder.flavor?.id === flavor.id ? 'selected' : ''}`;
                card.onclick = () => selectFlavor(flavor);
                
                card.innerHTML = `
                    <div style="padding: 10px 0;">
                        <div class="item-name" style="text-align: center; margin-bottom: 0;">${flavor.name}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Выбор вкуса
        function selectFlavor(flavor) {
            currentOrder.flavor = flavor;
            goToStep('checkout');
        }

        // Отображение сводки заказа на шаге чекаута
        function renderSummary() {
            const summaryBox = document.getElementById('order-summary');
            const devName = currentOrder.device ? currentOrder.device.name : '—';
            const devPrice = currentOrder.device ? currentOrder.device.price + ' руб.' : '0 руб.';
            const flavorName = currentOrder.flavor ? currentOrder.flavor.name : '—';

            summaryBox.innerHTML = `
                <div class="summary-row"><span>Устройство:</span> <strong>${devName}</strong></div>
                <div class="summary-row"><span>Вкус:</span> <strong>${flavorName}</strong></div>
                <div class="summary-row"><span>Итого к оплате:</span> <strong>${devPrice}</strong></div>
            `;
        }

        // Отправка заказа на сервер
        async function submitOrder() {
            const name = document.getElementById('input-name').value.trim();
            const phone = document.getElementById('input-phone').value.trim();
            const address = document.getElementById('input-address').value.trim();
            const comment = document.getElementById('input-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните все обязательные поля (имя, телефон, адрес)');
                return;
            }

            const submitBtn = document.getElementById('btn-submit-order');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            const payload = {
                telegram_id: tg?.initDataUnsafe?.user?.id || null,
                username: tg?.initDataUnsafe?.user?.username || null,
                device: currentOrder.device,
                flavor: currentOrder.flavor,
                customer: {
                    name: name,
                    phone: phone,
                    address: address,
                    comment: comment
                }
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/order`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    createdOrderId = result.order_id;
                    document.getElementById('success-desc-text').innerText = 
                        `Заказ №${createdOrderId} успешно создан и передан администратору. Ожидайте подтверждения.`;
                    goToStep('success');
                } else {
                    alert('Ошибка при оформлении: ' + (result.error || 'попробуйте снова'));
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Оформить';
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Не удалось связаться с сервером. Проверьте соединение.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Оформить';
            }
        }

        // Запрос на отмену созданного заказа
        async function cancelOrder() {
            if (!createdOrderId) {
                alert('Нет активного созданного заказа для отмены');
                return;
            }

            if (!confirm('Вы действительно хотите отменить этот заказ?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/${createdOrderId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    alert('Запрос на отмену отправлен администратору.');
                    closeWebApp();
                } else {
                    alert('Не удалось выполнить отмену заказа.');
                }
            } catch (error) {
                console.error('Ошибка сети при отмене:', error);
                alert('Ошибка сети при попытке отмены.');
            }
        }

        // Закрытие Web App
        function closeWebApp() {
            if (tg) {
                tg.close();
            } else {
                window.close();
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            fetchCatalog();
        });
    </script>
</body>
</html>
