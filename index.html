<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Razki_bot — Заказ устройств</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #121214;
            --tg-theme-text-color: #f3f3f6;
            --tg-theme-hint-color: #8e8e93;
            --tg-theme-button-color: #6c5ce7;
            --tg-theme-button-text-color: #ffffff;
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color);
            padding: 16px;
            padding-bottom: 90px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1, h2 {
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        h1 { font-size: 22px; color: #fff; }
        h2 { font-size: 18px; color: var(--tg-theme-hint-color); margin-top: 20px; }

        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* 3D Drum / Wheel Selector */
        .wheel-wrapper {
            position: relative;
            height: 160px;
            perspective: 1000px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-wrapper::before,
        .wheel-wrapper::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 50px;
            z-index: 5;
            pointer-events: none;
        }
        .wheel-wrapper::before {
            top: 0;
            background: linear-gradient(to bottom, var(--card-bg), rgba(26, 26, 30, 0));
        }
        .wheel-wrapper::after {
            bottom: 0;
            background: linear-gradient(to top, var(--card-bg), rgba(26, 26, 30, 0));
        }

        .wheel-indicator {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            transform: translateY(-50%);
            height: 40px;
            background: rgba(108, 92, 231, 0.12);
            border-top: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
        }

        .wheel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 60px 0;
            position: relative;
            z-index: 3;
            text-align: center;
        }
        .wheel-container::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 15px;
            color: var(--tg-theme-hint-color);
            opacity: 0.4;
            transform: scale(0.85);
            filter: blur(1px);
            transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            user-select: none;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wheel-item.active {
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* Form elements */
        input, select, textarea {
            width: 100%;
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            margin-top: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 16px;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        .summary-box {
            background: rgba(108, 92, 231, 0.08);
            border: 1px solid rgba(108, 92, 231, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .summary-box span {
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>Razki_bot Store</h1>

    <!-- СТРАНИЦА 1: Выбор модели и вкуса через барабаны -->
    <div id="pageSelection" class="page active">
        <div class="section">
            <h2>Выберите модель</h2>
            <div class="wheel-wrapper">
                <div class="wheel-indicator"></div>
                <div class="wheel-container" id="deviceWheel">
                    <!-- Заполняется динамически -->
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Выберите вкус</h2>
            <div class="wheel-wrapper">
                <div class="wheel-indicator"></div>
                <div class="wheel-container" id="flavorWheel">
                    <!-- Заполняется динамически -->
                </div>
            </div>
        </div>

        <button type="button" class="btn" id="goToOrderBtn">Далее к оформлению</button>
    </div>

    <!-- СТРАНИЦА 2: Оформление заказа -->
    <div id="pageOrder" class="page">
        <div class="section">
            <h2>Ваш выбор</h2>
            <div class="summary-box" id="orderSummaryText">
                Модель: <span id="sumModel">-</span><br>
                Цена: <span id="sumPrice">-</span><br>
                Вкус: <span id="sumFlavor">-</span>
            </div>

            <h2>Оформление заказа</h2>
            <form id="orderForm">
                <label>Имя получателя</label>
                <input type="text" id="nameInput" placeholder="Ваше имя" required>

                <label style="margin-top: 12px; display:block;">Телефон (WhatsApp)</label>
                <input type="tel" id="phoneInput" placeholder="+7 (___) ___-__-__" required>

                <label style="margin-top: 12px; display:block;">Адрес доставки</label>
                <input type="text" id="addressInput" placeholder="Улица, дом, квартира" required>

                <button type="submit" class="btn">Подтвердить заказ</button>
            </form>
            
            <button type="button" class="btn" id="backToSelectionBtn" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); box-shadow: none; margin-top: 8px;">Назад к выбору</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные каталога
        const catalogData = [
            { id: 'soPRO-20000', name: 'soPRO 20000', price: '6500 ₸', flavors: ['Мхохито', 'Клубничный лед', 'Арбузная жвачка', 'Двойное яблоко', 'Виноградный энергетик', 'Лесные ягоды'] },
            { id: 'PA-10000', name: 'PA 10000', price: '4800 ₸', flavors: ['Черника малина', 'Манго персик', 'Кока-кола', 'Холодная мята', 'Банановый смузи'] },
            { id: 'SLIM-8000', name: 'SLIM 8000', price: '4000 ₸', flavors: ['Киви маракуйя', 'Ананас кокос', 'Вишня лед', 'Энергетик'] }
        ];

        let selectedDevice = catalogData[0];
        let selectedFlavor = catalogData[0].flavors[0];

        const deviceWheel = document.getElementById('deviceWheel');
        const flavorWheel = document.getElementById('flavorWheel');
        
        const pageSelection = document.getElementById('pageSelection');
        const pageOrder = document.getElementById('pageOrder');

        // Инициализация барабана моделей
        function renderDeviceWheel() {
            deviceWheel.innerHTML = '';
            catalogData.forEach((device, index) => {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.textContent = `${device.name} (${device.price})`;
                item.onclick = () => {
                    deviceWheel.scrollTo({ top: index * 40, behavior: 'smooth' });
                };
                deviceWheel.appendChild(item);
            });
            updateDeviceActiveState();
        }

        // Инициализация барабана вкусов для выбранной модели
        function renderFlavorWheel(flavors) {
            flavorWheel.innerHTML = '';
            flavors.forEach((flavor, index) => {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.textContent = flavor;
                item.onclick = () => {
                    flavorWheel.scrollTo({ top: index * 40, behavior: 'smooth' });
                };
                flavorWheel.appendChild(item);
            });
            updateFlavorActiveState();
        }

        // Обновление активной модели
        function updateDeviceActiveState() {
            const scrollTop = deviceWheel.scrollTop;
            const index = Math.round(scrollTop / 40);
            const items = deviceWheel.querySelectorAll('.wheel-item');
            
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                    if (selectedDevice !== catalogData[idx]) {
                        selectedDevice = catalogData[idx];
                        renderFlavorWheel(selectedDevice.flavors); // Перезагружаем вкусы при смене модели
                    }
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // Обновление активного вкуса
        function updateFlavorActiveState() {
            const scrollTop = flavorWheel.scrollTop;
            const index = Math.round(scrollTop / 40);
            const items = flavorWheel.querySelectorAll('.wheel-item');
            
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                    selectedFlavor = item.textContent;
                } else {
                    item.classList.remove('active');
                }
            });
        }

        deviceWheel.addEventListener('scroll', updateDeviceActiveState);
        flavorWheel.addEventListener('scroll', updateFlavorActiveState);

        // Вибрация при завершении скролла
        deviceWheel.addEventListener('touchend', () => {
            setTimeout(() => { if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }, 100);
        });
        flavorWheel.addEventListener('touchend', () => {
            setTimeout(() => { if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }, 100);
        });

        // Переход на страницу заказа
        document.getElementById('goToOrderBtn').onclick = () => {
            document.getElementById('sumModel').textContent = selectedDevice.name;
            document.getElementById('sumPrice').textContent = selectedDevice.price;
            document.getElementById('sumFlavor').textContent = selectedFlavor;

            pageSelection.classList.remove('active');
            pageOrder.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            window.scrollTo(0, 0);
        };

        // Возврат к выбору
        document.getElementById('backToSelectionBtn').onclick = () => {
            pageOrder.classList.remove('active');
            pageSelection.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.scrollTo(0, 0);
        };

        // Автозаполнение имени
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('nameInput').value = tg.initDataUnsafe.user.first_name || '';
        }

        // Отправка формы заказа на бэкенд
        document.getElementById('orderForm').onsubmit = (e) => {
            e.preventDefault();
            const orderData = {
                device: selectedDevice.name,
                price: selectedDevice.price,
                flavor: selectedFlavor,
                name: document.getElementById('nameInput').value,
                phone: document.getElementById('phoneInput').value,
                address: document.getElementById('addressInput').value
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            }).then(() => {
                tg.close();
            }).catch(() => {
                alert('Заказ успешно создан!');
                tg.close();
            });
        };

        // Первичный запуск
        renderDeviceWheel();
        renderFlavorWheel(selectedDevice.flavors);
    </script>
</body>
</html>
