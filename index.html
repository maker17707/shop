<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор товара</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Шаги / Прогресс */
        .steps-indicator {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .step-dot {
            flex: 1;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            transition: background-color 0.3s;
        }

        .step-dot.active {
            background-color: var(--accent-color);
        }

        /* Основной блок барабана / выбора */
        .card-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* Стили барабана прокрутки */
        .wheel-wrapper {
            position: relative;
            height: 280px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-highlight {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 70px;
            border-top: 2px solid var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            background: rgba(59, 130, 246, 0.05);
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
        }

        .wheel-scroll {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            padding: 105px 0; /* Центрирование элементов */
            scroll-snap-type: y mandatory;
        }

        .wheel-scroll::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .wheel-item {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            cursor: pointer;
            scroll-snap-align: center;
            transition: opacity 0.2s, transform 0.2s;
            opacity: 0.4;
            text-align: left;
            gap: 12px;
        }

        .wheel-item.selected {
            opacity: 1;
            transform: scale(1.02);
        }

        .wheel-item-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            padding: 2px;
        }

        .wheel-item-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .wheel-item-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .wheel-item-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wheel-item-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Кнопки управления */
        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Финальный экран подтверждения */
        .checkout-screen {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .checkout-preview {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .checkout-img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
        }

        .checkout-details h3 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .checkout-details p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="mainTitle">Выбор устройства</h1>
            <p id="mainSubtitle">Прокрутите и выберите модель</p>
        </header>

        <div class="steps-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>

        <div class="card-container">
            <!-- Шаг 1 и 2: Барабан выбора -->
            <div id="wheelContainer">
                <div class="section-title" id="sectionTitle">Доступные модели</div>
                <div class="wheel-wrapper">
                    <div class="wheel-highlight"></div>
                    <div class="wheel-scroll" id="wheelScroll" onscroll="handleScroll()">
                        <!-- Динамические элементы генерируются через JS -->
                    </div>
                </div>
            </div>

            <!-- Шаг 3: Экран подтверждения -->
            <div class="checkout-screen" id="checkoutScreen">
                <div class="section-title">Ваш выбор</div>
                <div class="checkout-preview">
                    <img id="checkoutImg" class="checkout-img" src="" alt="Товар">
                    <div class="checkout-details">
                        <h3 id="checkoutModel">Модель</h3>
                        <p id="checkoutFlavor">Вкус</p>
                        <div id="checkoutStock" style="font-size: 0.75rem; color: #10b981; margin-top: 2px;"></div>
                        <div class="price-tag" id="checkoutPrice">0 ₸</div>
                    </div>
                </div>
            </div>

            <!-- Блок кнопок управления -->
            <div class="btn-group" id="btnGroup">
                <button class="btn btn-secondary" id="btnBack" style="display: none;" onclick="prevStep()">Назад</button>
                <button class="btn btn-primary" id="btnNext" onclick="nextStep()">Выбрать</button>
            </div>
        </div>
    </div>

    <script>
        // Резервный каталог на случай проблем с сетью
        let catalog = [
            {
                "id": "m1",
                "name": "Загрузка каталога...",
                "puffs": "Подождите",
                "price": "0 ₸",
                "image": "",
                "flavors": [
                    { "id": "f1", "name": "Загрузка вкусов...", "quantity": 0, "color": "#3b82f6" }
                ]
            }
        ];

        let currentStep = 1; // 1 - Модель, 2 - Вкус, 3 - Подтверждение
        let selectedModelIndex = 0;
        let selectedFlavorIndex = 0;

        // Загружаем актуальные данные с бэкенда при старте
        window.addEventListener('DOMContentLoaded', () => {
            fetchCatalog();
        });

        function fetchCatalog() {
            fetch('/api/catalog')
                .then(res => res.json())
                .then(data => {
                    const rawItems = data.catalog || data;
                    if (rawItems && Array.isArray(rawItems) && rawItems.length > 0) {
                        catalog = transformBackendData(rawItems);
                        renderDrum();
                    }
                })
                .catch(err => {
                    console.error("Ошибка загрузки каталога с сервера, используется резервный:", err);
                    // Если бэкенд не ответил, оставляем дефолт или пустой массив
                });
        }

        // Преобразование плоского списка из БД (model_name, flavor_name, quantity, selling_price, image_url) в иерархию
        function transformBackendData(rawItems) {
            const grouped = {};

            rawItems.forEach(item => {
                const modelKey = item.model_name || item.name || "Устройство";
                if (!grouped[modelKey]) {
                    grouped[modelKey] = {
                        id: item.id || Math.random().toString(),
                        name: modelKey,
                        puffs: item.puffs || "В наличии",
                        price: `${item.selling_price || item.price || 0} ₸`,
                        image: item.image_url || item.image || '',
                        flavors: []
                    };
                }

                grouped[modelKey].flavors.push({
                    id: item.id || Math.random().toString(),
                    name: item.flavor_name || item.name || "Классический",
                    quantity: item.quantity !== undefined ? item.quantity : 1,
                    color: item.flavor_icon || item.color || '#3b82f6'
                });
            });

            return Object.values(grouped);
        }

        // Отрисовка элементов в барабане
        function renderDrum() {
            const scrollContainer = document.getElementById('wheelScroll');
            scrollContainer.innerHTML = '';

            let itemsToRender = [];
            if (currentStep === 1) {
                itemsToRender = catalog;
            } else if (currentStep === 2) {
                const currentModel = catalog[selectedModelIndex] || catalog[0];
                itemsToRender = currentModel.flavors || [];
            }

            if (itemsToRender.length === 0) {
                scrollContainer.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-secondary);">Нет доступных элементов</div>`;
                return;
            }

            itemsToRender.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `wheel-item ${index === 0 ? 'selected' : ''}`;
                div.onclick = () => scrollToItem(index);

                if (currentStep === 1) {
                    const imgHtml = item.image ? `<img class="wheel-item-img" src="${item.image}" alt="">` : `<div class="wheel-item-img"></div>`;
                    div.innerHTML = `
                        ${imgHtml}
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">${item.price}</div>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="wheel-item-color" style="background-color: ${item.color || '#3b82f6'};"></div>
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">Остаток: ${item.quantity !== undefined ? item.quantity : 'много'} шт.</div>
                        </div>
                    `;
                }
                scrollContainer.appendChild(div);
            });

            highlightCenteredItem();
        }

        // Обработка скролла барабана для определения выбранного элемента
        function handleScroll() {
            const container = document.getElementById('wheelScroll');
            const items = container.getElementsByClassName('wheel-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;

            let closestIndex = 0;
            let minDistance = Infinity;

            Array.from(items).forEach((item, index) => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = index;
                }
            });

            Array.from(items).forEach((item, index) => {
                if (index === closestIndex) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });

            if (currentStep === 1) {
                selectedModelIndex = closestIndex;
            } else if (currentStep === 2) {
                selectedFlavorIndex = closestIndex;
            }
        }

        function scrollToItem(index) {
            const container = document.getElementById('wheelScroll');
            const items = container.getElementsByClassName('wheel-item');
            if (items[index]) {
                items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Управление шагами
        function nextStep() {
            if (currentStep === 1) {
                currentStep = 2;
                selectedFlavorIndex = 0;
                document.getElementById('mainTitle.textContent' || 'mainTitle').innerText = 'Выбор вкуса';
                document.getElementById('mainSubtitle').innerText = 'Выберите желаемый вкус';
                document.getElementById('sectionTitle').innerText = 'Доступные вкусы';
                document.getElementById('dot1').classList.remove('active');
                document.getElementById('dot2').classList.add('active');
                document.getElementById('btnBack').style.display = 'block';
                document.getElementById('btnNext').innerText = 'Подтвердить';
                renderDrum();
            } else if (currentStep === 2) {
                currentStep = 3;
                document.getElementById('mainTitle').innerText = 'Заказ сформирован';
                document.getElementById('mainSubtitle').innerText = 'Проверьте данные и отправьте';
                document.getElementById('dot2').classList.remove('active');
                document.getElementById('dot3').classList.add('active');
                
                // Переключаем видимость блоков
                document.getElementById('wheelContainer').style.display = 'none';
                document.getElementById('checkoutScreen').style.display = 'flex';
                document.getElementById('btnBack').style.display = 'block';
                document.getElementById('btnNext').innerText = 'Отправить администратору';

                // Заполняем данные экрана подтверждения
                const model = catalog[selectedModelIndex] || catalog[0];
                const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

                document.getElementById('checkoutImg').src = model.image || '';
                document.getElementById('checkoutModel').innerText = model.name;
                document.getElementById('checkoutFlavor').innerText = `Вкус: ${flavor.name}`;
                document.getElementById('checkoutStock').innerText = `В наличии: ${flavor.quantity} шт.`;
                document.getElementById('checkoutPrice').innerText = model.price;
            } else if (currentStep === 3) {
                // Отправка данных на ваш сервер (main.py)
                const model = catalog[selectedModelIndex] || catalog[0];
                const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

                const payload = {
                    model_id: model.id,
                    model_name: model.name,
                    flavor_id: flavor.id,
                    flavor_name: flavor.name,
                    price: model.price
                };

                // Отправляем данные на бэкенд
                fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(response => {
                    alert('Заказ успешно отправлен администратору!');
                    // Здесь можно закрыть WebApp, если запущено через Telegram:
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    }
                })
                .catch(err => {
                    console.error('Ошибка отправки:', err);
                    alert('Заказ сформирован! (Данные отправлены локально)');
                });
            }
        }

        function prevStep() {
            if (currentStep === 2) {
                currentStep = 1;
                selectedModelIndex = 0;
                document.getElementById('mainTitle').innerText = 'Выбор устройства';
                document.getElementById('mainSubtitle').innerText = 'Прокрутите и выберите модель';
                document.getElementById('sectionTitle').innerText = 'Доступные модели';
                document.getElementById('dot2').classList.remove('active');
                document.getElementById('dot1').classList.add('active');
                document.getElementById('btnBack').style.display = 'none';
                document.getElementById('btnNext').innerText = 'Выбрать';
                renderDrum();
            } else if (currentStep === 3) {
                currentStep = 2;
                document.getElementById('mainTitle').innerText = 'Выбор вкуса';
                document.getElementById('mainSubtitle').innerText = 'Выберите желаемый вкус';
                document.getElementById('dot3').classList.remove('active');
                document.getElementById('dot2').classList.add('active');

                document.getElementById('checkoutScreen').style.display = 'none';
                document.getElementById('wheelContainer').style.display = 'block';
                document.getElementById('btnNext').innerText = 'Подтвердить';
                renderDrum();
            }
        }
    </script>
</body>
</html>
