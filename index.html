<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rasky Kostanay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-color: #0d0d11;
            --text-color: #ffffff;
            --neon-color: #00f3ff;
            --neon-glow: rgba(0, 243, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 20px 0;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        header p {
            font-size: 13px;
            color: #8a8a9e;
            margin-top: 4px;
        }

        .step-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
        }

        .step {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .swiper {
            width: 100%;
            padding-top: 10px;
            padding-bottom: 30px;
        }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 260px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .device-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .device-card img {
            width: 160px;
            height: 190px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .swiper-slide-active .device-card img {
            transform: scale(1.06);
        }

        .device-title {
            margin-top: 12px;
            font-size: 19px;
            font-weight: 700;
            text-align: center;
        }

        .device-price {
            margin-top: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .neon-podium {
            width: 220px;
            height: 15px;
            border-radius: 50%;
            background: var(--neon-color);
            box-shadow: 0 0 25px 8px var(--neon-glow), 0 0 50px 15px var(--neon-glow);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            margin-top: -10px;
            z-index: 2;
        }

        .flavor-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            width: 80%;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            transition: border-color 0.4s ease;
        }

        .swiper-slide-active .flavor-card {
            border-color: var(--neon-color);
        }

        .flavor-name {
            font-size: 22px;
            font-weight: 700;
        }

        .flavor-stock {
            font-size: 12px;
            color: #8a8a9e;
            margin-top: 8px;
        }

        .form-group {
            width: 85%;
            max-width: 320px;
            margin-bottom: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00f3ff;
        }

        .btn-action {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: transform 0.2s ease;
            margin-top: 15px;
            z-index: 10;
            width: 80%;
            max-width: 300px;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #8a8a9e;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .loading {
            color: #8a8a9e;
            font-size: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rasky Kostanay</h1>
        <p id="step-subtitle">Шаг 1: Выберите устройство</p>
    </header>

    <div class="step-container">
        <!-- ШАГ 1: ВЫБОР УСТРОЙСТВА -->
        <div class="step active" id="step-device">
            <div class="swiper deviceSwiper">
                <div class="swiper-wrapper" id="device-list">
                    <div class="swiper-slide"><div class="loading">Загрузка каталога...</div></div>
                </div>
            </div>
            <button class="btn-action" onclick="confirmDevice()">Выбрать устройство</button>
        </div>

        <!-- ШАГ 2: ВЫБОР ВКУСА -->
        <div class="step" id="step-flavor">
            <button class="btn-back" onclick="goBackToDevices()">← Назад</button>
            <div class="swiper flavorSwiper">
                <div class="swiper-wrapper" id="flavor-list"></div>
            </div>
            <div class="neon-podium" id="neon-glow"></div>
            <button class="btn-action" onclick="confirmFlavor()">Выбрать вкус</button>
        </div>

        <!-- ШАГ 3: ОФОРМЛЕНИЕ ЗАКАЗА -->
        <div class="step" id="step-order">
            <button class="btn-back" onclick="goBackToFlavors()">← Назад</button>
            <div class="form-group">
                <input type="text" id="cust-name" placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <input type="tel" id="cust-phone" placeholder="WhatsApp телефон (+7...)">
            </div>
            <div class="form-group">
                <input type="text" id="cust-address" placeholder="Адрес доставки">
            </div>
            <div class="form-group">
                <input type="text" id="cust-comment" placeholder="Комментарий (необязательно)">
            </div>
            <button class="btn-action" onclick="submitOrder()">Оформить заказ</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        // Актуальный URL туннеля Serveo
        const API_BASE_URL = "https://icy-adults-fry.loca.lt";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let catalogData = [];
        let selectedDevice = null;
        let selectedFlavor = null;
        let deviceSwiper = null;
        let flavorSwiper = null;

        async function loadCatalog() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера');
                catalogData = await response.json();
                renderDevices();
            } catch (error) {
                console.error('Не удалось загрузить каталог:', error);
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Ошибка загрузки каталога</div></div>';
            }
        }

        function renderDevices() {
            if (!catalogData.length) {
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Нет товаров в наличии</div></div>';
                return;
            }

            const container = document.getElementById('device-list');
            container.innerHTML = catalogData.map(dev => `
                <div class="swiper-slide">
                    <div class="device-card">
                        <img src="images/${dev.image}" alt="${dev.name}" onerror="this.src='https://via.placeholder.com/160x190/1a1a24/ffffff?text=${encodeURIComponent(dev.name)}'">
                        <div class="device-title">${dev.name}</div>
                        <div class="device-price">${dev.price}</div>
                    </div>
                </div>
            `).join('');

            deviceSwiper = new Swiper('.deviceSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 35, stretch: 0, depth: 160, modifier: 1, slideShadows: false },
                on: { slideChange: () => triggerHaptic() }
            });
        }

        function renderFlavors(flavors) {
            const container = document.getElementById('flavor-list');
            container.innerHTML = flavors.map(fl => `
                <div class="swiper-slide">
                    <div class="flavor-card">
                        <div class="flavor-name">${fl.name}</div>
                        <div class="flavor-stock">В наличии: ${fl.stock} шт.</div>
                    </div>
                </div>
            `).join('');

            if (flavorSwiper) flavorSwiper.destroy();

            flavorSwiper = new Swiper('.flavorSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 30, stretch: 0, depth: 120, modifier: 1, slideShadows: false },
                on: {
                    init: function () { updateNeonGlow(flavors[this.activeIndex]); },
                    slideChange: function () {
                        triggerHaptic();
                        updateNeonGlow(flavors[this.activeIndex]);
                    }
                }
            });
        }

        function updateNeonGlow(flavor) {
            if (!flavor) return;
            const podium = document.getElementById('neon-glow');
            const color = flavor.color || '#00f3ff';
            podium.style.setProperty('--neon-color', color);
            podium.style.setProperty('--neon-glow', color + 'aa');
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function confirmDevice() {
            if (!catalogData.length) return;
            selectedDevice = catalogData[deviceSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
            renderFlavors(selectedDevice.flavors);
        }

        function goBackToDevices() {
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
        }

        function confirmFlavor() {
            selectedFlavor = selectedDevice.flavors[flavorSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = 'Оформление заказа';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-order').classList.add('active');
        }

        function goBackToFlavors() {
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-order').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const comment = document.getElementById('cust-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес!');
                return;
            }

            const cleanPrice = parseFloat(selectedDevice.price.replace(/[^\d]/g, '')) || 0;

            const orderData = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: [
                    {
                        model: selectedDevice.name,
                        flavor: selectedFlavor.name,
                        quantity: 1,
                        selling_price: cleanPrice
                    }
                ],
                total_price: cleanPrice,
                payment_type: "Наличные/Перевод",
                comment: comment
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`✅ Заказ #${result.order_id} успешно оформлен! Ожидайте доставку.`);
                    if (tg) tg.close();
                } else {
                    alert('Ошибка при оформлении заказа. Попробуйте еще раз.');
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка соединения с сервером.');
            }
        }

        loadCatalog();
    </script>
</body>
</html>
