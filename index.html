<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Vaka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .step-card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            display: none;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .step-card.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стиль игрового барабана */
        .slot-machine {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 16px;
            padding: 20px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #38bdf8;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2), 0 5px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .slot-image-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slot-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        .slot-display {
            font-size: 20px;
            font-weight: 800;
            padding: 12px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            min-height: 25px;
            color: #38bdf8;
        }

        .slot-price {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .slot-controls {
            display: flex;
            gap: 12px;
        }

        .slot-btn {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .slot-btn:active { background: #0ea5e9; }

        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            background: rgba(255,255,255,0.05);
            color: inherit;
        }

        .main-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .main-btn:active { background: #0ea5e9; }

        .secondary-btn {
            background: #475569;
            color: #fff;
            margin-top: 8px;
        }
        .secondary-btn:active { background: #334155; }

        .summary-box {
            font-size: 15px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛍️ Магазин Vaka</h1>

        <!-- ШАГ 1: Барабан выбора устройства -->
        <div id="step-device" class="step-card active">
            <h2>🎰 Выбор устройства</h2>
            
            <div class="slot-machine">
                <div style="font-size: 11px; color: #94a3b8; margin-bottom: 10px; letter-spacing: 1px;">КОЛЕСО УСТРОЙСТВ</div>
                
                <div class="slot-image-container">
                    <img id="slot-item-image" src="" alt="Устройство">
                </div>
                
                <div id="slot-item-name" class="slot-display">Загрузка...</div>
                <div id="slot-item-price" class="slot-price">0 ₸</div>
                
                <div class="slot-controls">
                    <button class="slot-btn" onclick="prevDevice()">⬅️ Назад</button>
                    <button class="slot-btn" onclick="nextDevice()">Вперед ➡️</button>
                </div>
            </div>

            <button class="main-btn" onclick="confirmDevice()">Выбрать это устройство</button>
        </div>

        <!-- ШАГ 2: Выбор вкуса -->
        <div id="step-flavor" class="step-card">
            <h2>🍏 Выбор вкуса</h2>
            <div id="selected-device-info" class="summary-box"></div>

            <label for="flavor-select">Доступные вкусы:</label>
            <select id="flavor-select"></select>

            <label for="qty-input">Количество:</label>
            <input type="number" id="qty-input" value="1" min="1" max="10">

            <button class="main-btn" onclick="goToCheckout()">Перейти к оформлению</button>
            <button class="main-btn secondary-btn" onclick="showStep('step-device')">Назад к устройствам</button>
        </div>

        <!-- ШАГ 3: Оформление заказа -->
        <div id="step-checkout" class="step-card">
            <h2>📦 Оформление заказа</h2>
            <div id="order-summary" class="summary-box"></div>

            <input type="text" id="cust-name" placeholder="Ваше Имя">
            <input type="text" id="cust-phone" placeholder="Телефон WhatsApp (+7700...)">
            <input type="text" id="cust-address" placeholder="Адрес доставки">
            <input type="text" id="cust-comment" placeholder="Комментарий (необязательно)">

            <p style="text-align: center; font-size: 18px; margin: 15px 0;"><strong>Итого: <span id="total-price" style="color: #4ade80;">0</span> ₸</strong></p>

            <button class="main-btn" onclick="submitOrder()">Отправить заказ</button>
            <button class="main-btn secondary-btn" onclick="showStep('step-flavor')">Назад к вкусам</button>
        </div>
    </div>

    <script>
        // Ссылка на ваш сервер (включенный туннель или VDS)
        const API_URL = "https://nine-socks-own.loca.lt";

        let catalogData = [];
        let currentIndex = 0;
        let selectedDevice = null;
        let finalCartItem = null;

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function loadCatalog() {
            try {
                let response = await fetch(`${API_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера');
                
                catalogData = await response.json();

                if (!catalogData || catalogData.length === 0) {
                    document.getElementById('slot-item-name').innerText = "Товары закончились";
                    document.getElementById('slot-item-price').innerText = "";
                    return;
                }

                currentIndex = 0;
                updateSlotDisplay();
            } catch (err) {
                console.error(err);
                document.getElementById('slot-item-name').innerText = "Ошибка соединения";
                alert('Не удалось подключиться к серверу каталога.');
            }
        }

        function updateSlotDisplay() {
            if (catalogData.length === 0) return;
            let item = catalogData[currentIndex];
            
            document.getElementById('slot-item-name').innerText = item.name;
            document.getElementById('slot-item-price').innerText = `${item.price} ₸`;
            
            let imgElement = document.getElementById('slot-item-image');
            if (item.image_url) {
                let imgUrl = item.image_url.startsWith('http') ? item.image_url : API_URL + item.image_url;
                imgElement.src = imgUrl;
                imgElement.style.display = 'block';
            } else {
                imgElement.src = "";
                imgElement.style.display = 'none';
            }
        }

        function nextDevice() {
            if (catalogData.length === 0) return;
            currentIndex = (currentIndex + 1) % catalogData.length;
            updateSlotDisplay();
        }

        function prevDevice() {
            if (catalogData.length === 0) return;
            currentIndex = (currentIndex - 1 + catalogData.length) % catalogData.length;
            updateSlotDisplay();
        }

        function confirmDevice() {
            if (catalogData.length === 0) {
                alert('Нет доступных устройств!');
                return;
            }

            selectedDevice = catalogData[currentIndex];
            document.getElementById('selected-device-info').innerText = `${selectedDevice.name} — ${selectedDevice.price} ₸`;

            let flavorSelect = document.getElementById('flavor-select');
            flavorSelect.innerHTML = '';

            if (selectedDevice.flavors && selectedDevice.flavors.length > 0) {
                selectedDevice.flavors.forEach(f => {
                    let opt = document.createElement('option');
                    opt.value = f.name;
                    opt.textContent = `${f.name} (Остаток: ${f.stock} шт.)`;
                    flavorSelect.appendChild(opt);
                });
            } else {
                let opt = document.createElement('option');
                opt.value = "Стандарт";
                opt.textContent = "Стандарт";
                flavorSelect.appendChild(opt);
            }

            showStep('step-flavor');
        }

        function goToCheckout() {
            let flavorSelect = document.getElementById('flavor-select');
            let qtyInput = document.getElementById('qty-input');

            let flavor = flavorSelect.value;
            let quantity = parseInt(qtyInput.value) || 1;
            
            let numericPrice = parseFloat(String(selectedDevice.price).replace(/[^0-9.]/g, '')) || 0;
            let total = numericPrice * quantity;

            finalCartItem = {
                model: selectedDevice.name,
                flavor: flavor,
                quantity: quantity,
                selling_price: numericPrice
            };

            document.getElementById('order-summary').innerText = `${selectedDevice.name} / Вкус: ${flavor} — ${quantity} шт.`;
            document.getElementById('total-price').innerText = total.toLocaleString();

            showStep('step-checkout');
        }

        function showStep(stepId) {
            document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        async function submitOrder() {
            let name = document.getElementById('cust-name').value.trim();
            let phone = document.getElementById('cust-phone').value.trim();
            let address = document.getElementById('cust-address').value.trim();
            let comment = document.getElementById('cust-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес доставки!');
                return;
            }

            let total = finalCartItem.selling_price * finalCartItem.quantity;

            let orderPayload = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: [finalCartItem],
                total_price: total,
                payment_type: "Наличные/Перевод",
                comment: comment
            };

            try {
                let response = await fetch(`${API_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                
                let result = await response.json();
                if (response.ok) {
                    alert('🎉 Заказ успешно оформлен! Спасибо за покупку.');
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    } else {
                        location.reload();
                    }
                } else {
                    alert('Ошибка сервера: ' + (result.detail || 'Не удалось создать заказ'));
                }
            } catch (err) {
                console.error(err);
                alert('Не удалось отправить заказ. Проверьте связь с сервером.');
            }
        }

        loadCatalog();
    </script>
</body>
</html>
