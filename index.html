<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Store Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --text-color: #f3f4f6;
            --subtext-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            padding-bottom: 24px;
        }

        /* Ambient Glow Background */
        .ambient-light {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 75%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
            filter: blur(35px);
        }

        header {
            position: relative;
            z-index: 10;
            padding: 20px 16px 10px;
            text-align: center;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .picker-section {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10px 0 20px;
        }

        /* Tabs Switcher */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            color: var(--subtext-color);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        /* 3D Wheel Drum */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            perspective: 800px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-selection-overlay {
            position: absolute;
            top: 50%;
            left: 6%;
            right: 6%;
            transform: translateY(-50%);
            height: 54px;
            border-top: 1.5px solid var(--accent-color);
            border-bottom: 1.5px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 15px var(--accent-glow);
            border-radius: 12px;
        }

        .wheel-drum {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            touch-action: none;
        }

        .wheel-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 270px;
            height: 50px;
            margin-top: -25px;
            margin-left: -135px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            backdrop-filter: blur(6px);
            backface-visibility: hidden;
        }

        .wheel-item-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .wheel-item-info {
            flex: 1;
            margin-left: 12px;
            text-align: left;
        }

        .wheel-item-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }

        .wheel-item-sub {
            font-size: 11px;
            color: var(--subtext-color);
        }

        .wheel-item-price {
            font-size: 14px;
            font-weight: 800;
            color: #34d399;
        }

        /* Order Info Card */
        .info-card {
            margin: 0 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .info-details h3 { font-size: 15px; font-weight: 700; }
        .info-details p { font-size: 12px; color: var(--subtext-color); margin-top: 3px; }

        .btn-order {
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-color), #4c1d95);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            outline: none;
            transition: transform 0.1s ease;
        }

        .btn-order:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="ambient-light" id="ambientLight"></div>

    <header>
        <h1>Каталог Товаров</h1>
    </header>

    <div class="picker-section">
        <div class="tabs">
            <div class="tab active" id="tabModel" onclick="switchTab('model')">1. Устройство</div>
            <div class="tab" id="tabFlavor" onclick="switchTab('flavor')">2. Вкус</div>
        </div>

        <div class="wheel-wrapper" id="wheelContainer">
            <div class="wheel-selection-overlay"></div>
            <div class="wheel-drum" id="wheelDrum"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-details">
            <h3 id="summaryTitle">Загрузка...</h3>
            <p id="summarySub">Выберите параметры</p>
        </div>
        <button class="btn-order" id="actionBtn" onclick="handleAction()">Далее</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); tg.ready(); }

        // Резервные данные из базы на случай, если catalog.json недоступен
        let catalog = [
            {
                "id": "m1",
                "name": "soPRO-20000",
                "puffs": "20 000 затяжек",
                "price": "8 500 ₸",
                "flavors": [
                    { "id": "f101", "name": "Арбуз с ЧЗ", "color": "#ef4444", "bgGlow": "rgba(239, 68, 68, 0.35)" },
                    { "id": "f102", "name": "Черника Малина с ЧЗ", "color": "#3b82f6", "bgGlow": "rgba(59, 130, 246, 0.35)" },
                    { "id": "f103", "name": "Мята с ЧЗ", "color": "#10b981", "bgGlow": "rgba(16, 185, 129, 0.35)" },
                    { "id": "f104", "name": "Киви Маракуйя Гуава с ЧЗ", "color": "#84cc16", "bgGlow": "rgba(132, 204, 22, 0.35)" },
                    { "id": "f105", "name": "Клубника Арбуз с ЧЗ", "color": "#f43f5e", "bgGlow": "rgba(244, 63, 94, 0.35)" }
                ]
            },
            {
                "id": "m2",
                "name": "PA-10000",
                "puffs": "10 000 затяжек",
                "price": "6 500 ₸",
                "flavors": [
                    { "id": "f201", "name": "Арбуз с ЧЗ", "color": "#ef4444", "bgGlow": "rgba(239, 68, 68, 0.35)" },
                    { "id": "f202", "name": "Клубника Банан с ЧЗ", "color": "#f59e0b", "bgGlow": "rgba(245, 158, 11, 0.35)" },
                    { "id": "f203", "name": "Манго Персик с ЧЗ", "color": "#f97316", "bgGlow": "rgba(249, 115, 22, 0.35)" },
                    { "id": "f204", "name": "Черника Малина с ЧЗ", "color": "#3b82f6", "bgGlow": "rgba(59, 130, 246, 0.35)" },
                    { "id": "f205", "name": "Клубника Киви с ЧЗ", "color": "#ec4899", "bgGlow": "rgba(236, 72, 153, 0.35)" },
                    { "id": "f206", "name": "Мята с ЧЗ", "color": "#10b981", "bgGlow": "rgba(16, 185, 129, 0.35)" },
                    { "id": "f207", "name": "Киви Маракуйя Гуава с ЧЗ", "color": "#84cc16", "bgGlow": "rgba(132, 204, 22, 0.35)" },
                    { "id": "f208", "name": "Вишня с ЧЗ", "color": "#881337", "bgGlow": "rgba(136, 19, 55, 0.35)" },
                    { "id": "f209", "name": "Ягодный микс с ЧЗ", "color": "#7c3aed", "bgGlow": "rgba(124, 58, 237, 0.35)" },
                    { "id": "f210", "name": "Вишневая Шипучка с ЧЗ", "color": "#e11d48", "bgGlow": "rgba(225, 29, 72, 0.35)" }
                ]
            },
            {
                "id": "m3",
                "name": "Slim-8000",
                "puffs": "8 000 затяжек",
                "price": "5 500 ₸",
                "flavors": [
                    { "id": "f301", "name": "Клубника Арбуз", "color": "#f43f5e", "bgGlow": "rgba(244, 63, 94, 0.35)" },
                    { "id": "f302", "name": "Черника Малина Персик", "color": "#6366f1", "bgGlow": "rgba(99, 102, 241, 0.35)" },
                    { "id": "f303", "name": "Клубника Киви", "color": "#ec4899", "bgGlow": "rgba(236, 72, 153, 0.35)" },
                    { "id": "f304", "name": "Ягодный Микс", "color": "#8b5cf6", "bgGlow": "rgba(139, 92, 246, 0.35)" },
                    { "id": "f305", "name": "Ананас со льдом", "color": "#eab308", "bgGlow": "rgba(234, 179, 8, 0.35)" }
                ]
            }
        ];

        let currentTab = 'model';
        let selectedModelIndex = 0;
        let selectedFlavorIndex = 0;

        let currentAngle = 0;
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let lastSelectedIndex = -1;

        const drum = document.getElementById('wheelDrum');
        const container = document.getElementById('wheelContainer');

        // Подгрузка внешнего файла catalog.json
        fetch('catalog.json')
            .then(res => res.json())
            .then(data => {
                if (data && data.length) {
                    catalog = data;
                    renderDrum();
                }
            })
            .catch(() => renderDrum());

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        function renderDrum() {
            drum.innerHTML = '';
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const itemCount = items.length;
            
            const angleStep = 360 / Math.max(itemCount, 8); 
            const radius = 95; 

            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'wheel-item';
                
                const itemAngle = index * angleStep;
                el.style.transform = `rotateX(${-itemAngle}deg) translateZ(${radius}px)`;

                if (currentTab === 'model') {
                    el.innerHTML = `
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">${item.puffs}</div>
                        </div>
                        <div class="wheel-item-price">${item.price}</div>
                    `;
                } else {
                    el.innerHTML = `
                        <div class="wheel-item-icon" style="background:${item.color}; color:${item.color};"></div>
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">В наличии</div>
                        </div>
                    `;
                }
                drum.appendChild(el);
            });

            const activeIndex = currentTab === 'model' ? selectedModelIndex : selectedFlavorIndex;
            currentAngle = activeIndex * angleStep;
            updateDrumTransform();
        }

        function updateDrumTransform() {
            drum.style.transform = `rotateX(${currentAngle}deg)`;
            
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            
            let normalizedAngle = (currentAngle % 360 + 360) % 360;
            let activeIdx = Math.round(normalizedAngle / angleStep) % items.length;

            if (activeIdx !== lastSelectedIndex) {
                lastSelectedIndex = activeIdx;
                triggerHaptic();

                if (currentTab === 'model') {
                    selectedModelIndex = activeIdx;
                    selectedFlavorIndex = 0;
                } else {
                    selectedFlavorIndex = activeIdx;
                }
                updateSummary();
            }
        }

        function updateSummary() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            document.getElementById('summaryTitle').innerText = model.name;
            document.getElementById('summarySub').innerText = `Вкус: ${flavor.name} • ${model.price}`;

            document.documentElement.style.setProperty('--accent-color', flavor.color || '#8b5cf6');
            document.documentElement.style.setProperty('--accent-glow', flavor.bgGlow || 'rgba(139, 92, 246, 0.35)');

            const btn = document.getElementById('actionBtn');
            if (currentTab === 'model') {
                btn.innerText = 'Выбрать вкус →';
            } else {
                btn.innerText = 'Оплатить';
            }
        }

        function switchTab(tab) {
            triggerHaptic();
            currentTab = tab;
            document.getElementById('tabModel').classList.toggle('active', tab === 'model');
            document.getElementById('tabFlavor').classList.toggle('active', tab === 'flavor');
            lastSelectedIndex = -1;
            renderDrum();
        }

        function handleAction() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            if (currentTab === 'model') {
                switchTab('flavor');
            } else {
                submitOrder();
            }
        }

        // Touch events
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches[0].clientY;
            drum.style.transition = 'none';
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = startY - currentY;
            currentAngle += deltaY * 0.35;
            startY = currentY;
            updateDrumTransform();
        }, { passive: true });

        container.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            snapToItem();
        });

        function snapToItem() {
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            currentAngle = Math.round(currentAngle / angleStep) * angleStep;
            drum.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1)';
            updateDrumTransform();
        }

        function submitOrder() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            const orderData = {
                model_id: model.id,
                model_name: model.name,
                flavor_id: flavor.id,
                flavor_name: flavor.name,
                price: model.price
            };

            if (tg) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert(`Заказ оформлен: ${model.name} (${flavor.name}) — ${model.price}`);
            }
        }

        renderDrum();
    </script>
</body>
</html>
