<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 16px;
        }

        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .card {
            background-color: var(--secondary-bg-color);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .card.selected {
            border-color: var(--button-color);
        }

        .card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-price {
            font-size: 13px;
            color: var(--hint-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        .btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--button-color);
            border: 1px solid var(--button-color);
            margin-top: 8px;
        }

        .success-box {
            text-align: center;
            padding: 30px 10px;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <h2 id="step-title">Каталог товаров</h2>
    <div class="subtitle" id="step-subtitle">Шаг 1: Выберите устройство</div>

    <!-- ШАГ 1: Выбор устройства -->
    <div id="step-device" class="step-container active">
        <div class="grid" id="devices-grid">
            <!-- Динамически загружается из JS -->
        </div>
    </div>

    <!-- ШАГ 2: Выбор вкуса -->
    <div id="step-flavor" class="step-container">
        <div class="grid" id="flavors-grid">
            <!-- Динамически загружается из JS -->
        </div>
        <button class="btn btn-secondary" onclick="backToDevices()">Назад к устройствам</button>
    </div>

    <!-- ШАГ 3: Контактные данные и оформление -->
    <div id="step-checkout" class="step-container">
        <div class="form-group">
            <label for="cust-name">Ваше имя</label>
            <input type="text" id="cust-name" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label for="cust-phone">Номер телефона</label>
            <input type="tel" id="cust-phone" placeholder="+7 (___) ___-__-__">
        </div>
        <div class="form-group">
            <label for="cust-address">Адрес доставки</label>
            <input type="text" id="cust-address" placeholder="Город, улица, дом, квартира">
        </div>
        <div class="form-group">
            <label for="cust-comment">Комментарий к заказу (необязательно)</label>
            <textarea id="cust-comment" placeholder="Пожелания по времени доставки..."></textarea>
        </div>
        <button class="btn" id="submit-order-btn" onclick="submitOrder()">Оформить заказ</button>
        <button class="btn btn-secondary" onclick="backToFlavors()">Назад к выбору вкуса</button>
    </div>

    <!-- УСПЕХ / СТАТУС ЗАКАЗА -->
    <div id="step-success" class="step-container success-box">
        <div class="success-icon">🎉</div>
        <h2>Заказ успешно оформлен!</h2>
        <p class="subtitle" id="order-id-text">Мы передали данные администратору. Ожидайте подтверждения.</p>
        <button class="btn btn-secondary" onclick="requestCancelOrder()">Отменить заказ</button>
        <button class="btn" onclick="closeWebApp()" style="margin-top: 10px;">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        // Укажите ваш актуальный API URL сервера (например: "https://yourdomain.com" или "http://localhost:8000")
        // Если фронтенд отдается тем же сервером, можно оставить пустым: ""
        const API_BASE_URL = ""; 

        let selectedDevice = null;
        let selectedFlavor = null;
        let createdOrderId = null;

        // Данные каталога (по умолчанию резервные, могут подгружаться с бэкенда)
        let catalogData = {
            devices: [
                { id: 1, name: "Device Alpha", price: 1500, image: "https://via.placeholder.com/150" },
                { id: 2, name: "Device Beta", price: 2200, image: "https://via.placeholder.com/150" }
            ],
            flavors: {
                1: [
                    { id: 101, name: "Минт Айс", price: 0 },
                    { id: 102, name: "Ягодный Микс", price: 0 }
                ],
                2: [
                    { id: 201, name: "Манго Маракуйя", price: 0 },
                    { id: 202, name: "Ледяной Арбуз", price: 0 }
                ]
            }
        };

        async function loadCatalog() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/catalog`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.devices) {
                        catalogData = data;
                    }
                }
            } catch (e) {
                console.log('Используем локальный каталог (сервер недоступен для загрузки каталога)');
            }

            const grid = document.getElementById('devices-grid');
            grid.innerHTML = '';
            
            catalogData.devices.forEach(dev => {
                const card = document.createElement('div');
                card.className = `card ${selectedDevice?.id === dev.id ? 'selected' : ''}`;
                card.onclick = () => selectDevice(dev);
                card.innerHTML = `
                    <img src="${dev.image || 'https://via.placeholder.com/150'}" alt="${dev.name}">
                    <div class="card-title">${dev.name}</div>
                    <div class="card-price">${dev.price} руб.</div>
                `;
                grid.appendChild(card);
            });
        }

        function selectDevice(device) {
            selectedDevice = device;
            selectedFlavor = null;
            
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
            document.getElementById('step-subtitle').innerText = `Шаг 2: Вкус для ${device.name}`;
            
            loadFlavors(device.id);
        }

        function loadFlavors(deviceId) {
            const grid = document.getElementById('flavors-grid');
            grid.innerHTML = '';
            
            const flavors = catalogData.flavors[deviceId] || [];
            flavors.forEach(flavor => {
                const card = document.createElement('div');
                card.className = `card ${selectedFlavor?.id === flavor.id ? 'selected' : ''}`;
                card.onclick = () => selectFlavor(flavor);
                card.innerHTML = `
                    <div class="card-title" style="margin: 20px 0;">${flavor.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function selectFlavor(flavor) {
            selectedFlavor = flavor;
            
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-checkout').classList.add('active');
            document.getElementById('step-subtitle').innerText = 'Шаг 3: Контактные данные';
        }

        function backToDevices() {
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
        }

        function backToFlavors() {
            document.getElementById('step-checkout').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
            document.getElementById('step-subtitle').innerText = `Шаг 2: Вкус для ${selectedDevice.name}`;
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const comment = document.getElementById('cust-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните обязательные поля (имя, телефон, адрес)');
                return;
            }

            const orderData = {
                telegram_id: tg?.initDataUnsafe?.user?.id || 123456789,
                username: tg?.initDataUnsafe?.user?.username || 'test_user',
                device: selectedDevice,
                flavor: selectedFlavor,
                customer: { name, phone, address, comment }
            };

            const submitBtn = document.getElementById('submit-order-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            try {
                const response = await fetch(`${API_BASE_URL}/api/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (response.ok) {
                    createdOrderId = result.order_id;
                    
                    document.getElementById('step-checkout').classList.remove('active');
                    document.getElementById('step-success').classList.add('active');
                    document.getElementById('step-title').innerText = 'Готово';
                    document.getElementById('step-subtitle').innerText = '';
                    document.getElementById('order-id-text').innerText = `Заказ №${createdOrderId} успешно создан. Администратор уже получил уведомление.`;
                } else {
                    alert('Ошибка при оформлении заказа: ' + (result.error || 'Попробуйте еще раз.'));
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Оформить заказ';
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Не удалось связаться с сервером. Проверьте соединение.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Оформить заказ';
            }
        }

        function closeWebApp() {
            if (tg) {
                tg.close();
            } else {
                window.close();
            }
        }

        async function requestCancelOrder() {
            if (!createdOrderId) {
                alert('Нет активного заказа для отмены');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/${createdOrderId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert('Запрос на отмену заказа успешно отправлен.');
                    closeWebApp();
                } else {
                    alert('Не удалось отправить запрос на отмену.');
                }
            } catch (error) {
                console.error('Ошибка отмены:', error);
                alert('Ошибка сети при отмене заказа.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCatalog();
        });
    </script>
</body>
</html>
