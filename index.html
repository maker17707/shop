<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Razki_bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #8b949e;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.3);
            --kaspi-color: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #1a0f14 0%, var(--bg-color) 70%);
        }

        /* HEADER */
        header {
            padding: 16px;
            text-align: center;
            background: transparent;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ff5252;
            text-transform: uppercase;
        }

        /* TABS (1. Устройство / 2. Вкус) */
        .tabs-container {
            display: flex;
            justify-content: center;
            padding: 8px 16px 16px 16px;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 10px 22px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        /* 3D DRUM SCENE */
        .drum-viewport {
            height: 280px;
            perspective: 1000px;
            position: relative;
            overflow: hidden;
            margin: 5px 0;
            cursor: grab;
        }

        .drum-viewport:active {
            cursor: grabbing;
        }

        .drum-container {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .drum-item {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 86%;
            max-width: 360px;
            height: 80px;
            margin-left: -43%;
            margin-top: -40px;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            backface-visibility: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .drum-item img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            pointer-events: none;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            overflow: hidden;
        }

        .item-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .item-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .item-price {
            font-size: 16px;
            font-weight: 800;
            color: #34d399;
        }

        .flavor-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
            flex-shrink: 0;
        }

        /* BOTTOM FLOATING CARD */
        .info-card {
            margin: auto 16px 16px 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .info-text-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-title-preview {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .info-sub-preview {
            font-size: 12px;
            color: var(--text-sub);
        }

        .btn-action {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            white-space: nowrap;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* CHECKOUT & FORM SECTIONS */
        .page-section {
            display: none;
            flex-direction: column;
            padding: 16px;
            gap: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #ff416c;
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .btn-pay-option {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.03);
            color: var(--text-sub);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-pay-option.active {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.12);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #161b22;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            margin-top: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .autocomplete-item {
            padding: 10px 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
            color: #f8fafc;
        }

        .autocomplete-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .btn-geo {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .nav-buttons-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn-primary-full {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            flex: 2;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            text-align: center;
        }

        /* LOADING OVERLAY */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ff416c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-size: 13px; color: var(--text-sub);">Загрузка остатков...</div>
    </div>

    <header>
        <h1 id="pageTitle">Каталог товаров</h1>
    </header>

    <!-- СЕКЦИЯ КАТАЛОГА (БАРАБАН) -->
    <div id="pickerSection">
        <div class="tabs-container">
            <button class="tab-btn active" id="tabModel" onclick="switchTab('model')">1. Устройство</button>
            <button class="tab-btn" id="tabFlavor" onclick="switchTab('flavor')">2. Вкус</button>
        </div>

        <div class="drum-viewport" id="drumViewport">
            <div class="drum-container" id="drumContainer"></div>
        </div>
    </div>

    <!--НИЖНЯЯ КАРТОЧКА ПРЕВЬЮ В КАТАЛОГЕ -->
    <div class="info-card" id="infoCard">
        <div class="info-text-group">
            <div class="info-title-preview" id="infoTitlePreview">soPRO-20000</div>
            <div class="info-sub-preview" id="infoSubtext">Вкус: Арбуз с ЧЗ • 15 000 ₸</div>
        </div>
        <button class="btn-action" onclick="goToFormPage()">Выбрать вкус →</button>
    </div>

    <!-- СЕКЦИЯ ОФОРМЛЕНИЯ ДОСТАВКИ (КАК НА СКРИНШОТЕ) -->
    <div id="formSection" class="page-section">
        <div class="form-group">
            <label>Ваше имя</label>
            <input type="text" id="custName" class="form-control" placeholder="Курильщик">
        </div>

        <div class="form-group">
            <label>Телефон WhatsApp (+7)</label>
            <input type="tel" id="custPhone" class="form-control" placeholder="+7 (___) ___-__-__" value="+7 (">
            <div class="hint-text">🟢 Курьер совершит WhatsApp-аудиозвонок</div>
        </div>

        <div class="form-group">
            <label>Адрес доставки (город, улица, дом)</label>
            <input type="text" id="custAddress" class="form-control" placeholder="Начните вводить адрес или улицу..." oninput="handleAddressInput(this.value)">
            <div class="autocomplete-list" id="addressList"></div>
            <button class="btn-geo" onclick="detectLocation()">📍 Определить, где я нахожусь</button>
        </div>

        <div class="form-group">
            <label>Способ оплаты (оплата при получении)</label>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn-pay-option active" id="btnPayKaspi" onclick="setPaymentType('Kaspi QR / Red')">⚡ Kaspi QR / Red</button>
                <button type="button" class="btn-pay-option" id="btnPayCash" onclick="setPaymentType('Наличными курьеру')">💵 Наличными курьеру</button>
            </div>
            <div class="hint-text">ℹ️ Оплата производится строго курьеру при получении.</div>
        </div>

        <div class="form-group">
            <label>Комментарий курьеру (квартира, подъезд)</label>
            <input type="text" id="custComment" class="form-control" placeholder="Кв. 12, подъезд 2, домофон...">
        </div>

        <div class="nav-buttons-row">
            <button class="btn-secondary" onclick="goBackToPicker()">← Назад</button>
            <button class="btn-primary-full" onclick="submitFinalOrder()">Подтвердить</button>
        </div>
    </div>

    <!-- СЕКЦИЯ УСПЕХА -->
    <div id="successSection" class="page-section" style="text-align: center; justify-content: center; min-height: 60vh;">
        <div style="font-size: 50px; margin-bottom: 10px;">🎉</div>
        <h2 style="color: #fff;">Заказ принят!</h2>
        <p id="successDetails" style="color: var(--text-sub); font-size: 13px; margin: 10px 0 20px 0; line-height: 1.5;"></p>
        <button class="btn-primary-full" onclick="closeWebApp()" style="width: 100%;">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const API_BASE = window.location.origin.includes("http") ? window.location.origin : "http://127.0.0.1:8000";

        let catalog = [];
        let currentTab = 'model'; // 'model' | 'flavor'
        let selectedModelIndex = 0;
        let selectedFlavorIndex = 0;
        let paymentType = 'Kaspi QR / Red';
        let addressTimeout = null;

        // ПАРАМЕТРЫ 3D БАРАБАНА
        let currentAngle = 0;
        let startY = 0;
        let isDragging = false;
        let startAngle = 0;
        const radius = 130;

        function getLocalImage(modelName) {
            if (!modelName) return "images/default.png";
            let formatted = modelName.toLowerCase().replace(/[^a-z0-9а-яё]+/g, '_').replace(/^_+|_+$/g, '');
            return `images/${formatted}.png`;
        }

        async function initApp() {
            try {
                const response = await fetch(`${API_BASE}/api/catalog`);
                const data = await response.json();
                if (data && data.length > 0) {
                    catalog = data;
                } else {
                    throw new Error("Пусто");
                }
            } catch (err) {
                console.warn("Бэкенд недоступен, используются демо-данные по скриншотам:", err);
                catalog = [
                    {
                        name: "soPRO-20000",
                        subtitle: "20 000 затяжек",
                        price: "15 000 ₸",
                        flavors: [
                            { name: "Арбуз с ЧЗ", stock: 5, color: "#ef4444" },
                            { name: "Клубничный Милкшейк", stock: 3, color: "#ec4899" },
                            { name: "Ледяная Мята", stock: 8, color: "#06b6d4" }
                        ]
                    },
                    {
                        name: "PA-10000",
                        subtitle: "10 000 затяжек",
                        price: "12 000 ₸",
                        flavors: [
                            { name: "Виноградный Лёд", stock: 4, color: "#8b5cf6" },
                            { name: "Энергетик", stock: 6, color: "#eab308" }
                        ]
                    }
                ];
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
                renderDrum();
                updateInfoCard();
            }
        }

        function getAngleStep(count) {
            return count > 0 ? 360 / count : 360;
        }

        function renderDrum() {
            const container = document.getElementById('drumContainer');
            container.innerHTML = '';

            const items = currentTab === 'model' ? catalog : (catalog[selectedModelIndex]?.flavors || []);
            const angleStep = getAngleStep(items.length);

            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'drum-item';
                
                const itemAngle = index * angleStep;
                el.dataset.angle = itemAngle;
                el.dataset.index = index;

                const currentModel = catalog[selectedModelIndex];
                const imgPath = currentModel ? getLocalImage(currentModel.name) : "images/default.png";

                if (currentTab === 'model') {
                    el.innerHTML = `
                        <img src="${imgPath}" alt="${item.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3050/3050153.png'">
                        <div class="item-details">
                            <div class="item-title">${item.name}</div>
                            <div class="item-subtitle">${item.subtitle || ''}</div>
                        </div>
                        <div class="item-price">${item.price}</div>
                    `;
                } else {
                    el.innerHTML = `
                        <div class="flavor-badge" style="background: ${item.color || '#ff416c'}; color: ${item.color || '#ff416c'}"></div>
                        <div class="item-details">
                            <div class="item-title">${item.name}</div>
                            <div class="item-subtitle">Остаток: ${item.stock} шт.</div>
                        </div>
                    `;
                }

                container.appendChild(el);
            });

            currentAngle = (currentTab === 'model' ? selectedModelIndex : selectedFlavorIndex) * angleStep;
            updateDrumTransform();
        }

        function updateDrumTransform() {
            const container = document.getElementById('drumContainer');
            const items = container.querySelectorAll('.drum-item');
            const angleStep = getAngleStep(items.length);

            container.style.transform = `rotateX(${-currentAngle}deg)`;

            let closestIdx = 0;
            let minDiff = Infinity;

            items.forEach((item, idx) => {
                const itemAngle = idx * angleStep;
                let diff = Math.abs((currentAngle % 360) - itemAngle);
                if (diff > 180) diff = 360 - diff;

                if (diff < minDiff) {
                    minDiff = diff;
                    closestIdx = idx;
                }

                item.style.transform = `rotateX(${itemAngle}deg) translateZ(${radius}px)`;
                item.style.opacity = Math.max(0.2, 1 - diff / 90);
                item.style.filter = `blur(${Math.min(4, diff / 25)}px)`;
            });

            if (currentTab === 'model') {
                if (selectedModelIndex !== closestIdx) {
                    selectedModelIndex = closestIdx;
                    selectedFlavorIndex = 0;
                    triggerHaptic();
                }
            } else {
                if (selectedFlavorIndex !== closestIdx) {
                    selectedFlavorIndex = closestIdx;
                    triggerHaptic();
                }
            }

            updateInfoCard();
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        function updateInfoCard() {
            const model = catalog[selectedModelIndex];
            if (!model) return;
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            document.getElementById('infoTitlePreview').innerText = model.name;
            document.getElementById('infoSubtext').innerText = `Вкус: ${flavor ? flavor.name : '—'} • ${model.price}`;
            
            const btn = document.querySelector('#infoCard .btn-action');
            if (currentTab === 'model') {
                btn.innerText = 'Выбрать вкус →';
                btn.onclick = () => switchTab('flavor');
            } else {
                btn.innerText = 'Оформить заказ →';
                btn.onclick = goToFormPage;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabModel').classList.toggle('active', tab === 'model');
            document.getElementById('tabFlavor').classList.toggle('active', tab === 'flavor');
            renderDrum();
        }

        // ОБРАБОТКА СВАЙПОВ
        const viewport = document.getElementById('drumViewport');

        function onPointerDown(e) {
            isDragging = true;
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            startAngle = currentAngle;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaY = startY - y;
            currentAngle = startAngle + deltaY * 0.4;
            updateDrumTransform();
        }

        function onPointerUp() {
            if (!isDragging) return;
            isDragging = false;

            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = getAngleStep(items.length);

            let targetIdx = Math.round(currentAngle / angleStep);
            targetIdx = Math.max(0, Math.min(targetIdx, items.length - 1));

            currentAngle = targetIdx * angleStep;
            updateDrumTransform();
        }

        viewport.addEventListener('touchstart', onPointerDown, { passive: true });
        viewport.addEventListener('touchmove', onPointerMove, { passive: true });
        viewport.addEventListener('touchend', onPointerUp);
        viewport.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        function goToFormPage() {
            document.getElementById('pickerSection').style.display = 'none';
            document.getElementById('infoCard').style.display = 'none';
            document.getElementById('formSection').style.display = 'flex';
            document.getElementById('pageTitle').innerText = 'Оформление доставки';

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                const nameInput = document.getElementById('custName');
                if (!nameInput.value || nameInput.value === 'Курильщик') {
                    nameInput.value = [u.first_name, u.last_name].filter(Boolean).join(' ');
                }
            }
        }

        function goBackToPicker() {
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('pickerSection').style.display = 'block';
            document.getElementById('infoCard').style.display = 'flex';
            document.getElementById('pageTitle').innerText = 'Каталог товаров';
        }

        function setPaymentType(type) {
            paymentType = type;
            document.getElementById('btnPayKaspi').classList.toggle('active', type === 'Kaspi QR / Red');
            document.getElementById('btnPayCash').classList.toggle('active', type === 'Наличными курьеру');
            triggerHaptic();
        }

        function handleAddressInput(value) {
            clearTimeout(addressTimeout);
            const list = document.getElementById('addressList');

            if (value.length < 3) {
                list.style.display = 'none';
                return;
            }

            addressTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(value)}&limit=4&addressdetails=1`)
                    .then(res => res.json())
                    .then(data => {
                        list.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(item => {
                                const el = document.createElement('div');
                                el.className = 'autocomplete-item';
                                el.innerText = item.display_name;
                                el.onclick = () => {
                                    document.getElementById('custAddress').value = item.display_name;
                                    list.style.display = 'none';
                                };
                                list.appendChild(el);
                            });
                            list.style.display = 'block';
                        } else {
                            list.style.display = 'none';
                        }
                    })
                    .catch(() => { list.style.display = 'none'; });
            }, 400);
        }

        function detectLocation() {
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }

            const btn = document.querySelector('.btn-geo');
            btn.innerText = '⏳ Определяем координаты...';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`)
                        .then(res => res.json())
                        .then(data => {
                            if (data && data.display_name) {
                                document.getElementById('custAddress').value = data.display_name;
                            } else {
                                document.getElementById('custAddress').value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                            }
                        })
                        .catch(() => {
                            document.getElementById('custAddress').value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                        })
                        .finally(() => {
                            btn.innerText = '📍 Определить, где я нахожусь';
                        });
                },
                () => {
                    btn.innerText = '📍 Определить, где я нахожусь';
                    alert('Не удалось получить геопозицию.');
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        async function submitFinalOrder() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const comment = document.getElementById('custComment').value.trim();

            if (!name) { alert('Укажите ваше имя.'); return; }
            if (phone.length < 10) { alert('Укажите корректный номер телефона.'); return; }
            if (!address) { alert('Укажите адрес доставки.'); return; }

            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];
            const numericPrice = parseFloat(model.price.replace(/[^0-9.]/g, '')) || 0;

            const orderPayload = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: [
                    {
                        model: model.name,
                        flavor: flavor.name,
                        quantity: 1,
                        selling_price: numericPrice
                    }
                ],
                total_price: numericPrice,
                payment_type: paymentType,
                comment: comment
            };

            try {
                await fetch(`${API_BASE}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
            } catch (err) {
                console.warn("Ошибка отправки на бэкенд:", err);
            }

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'flex';
            document.getElementById('pageTitle').innerText = 'Успешно';
            document.getElementById('successDetails').innerText = 
                `Спасибо, ${name}! Заказ (${model.name} — ${flavor.name}) принят в обработку. Курьер свяжется с вами по WhatsApp.`;
        }

        function closeWebApp() {
            if (tg) {
                tg.close();
            } else {
                location.reload();
            }
        }

        initApp();
    </script>
</body>
</html>
