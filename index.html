<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Store Catalog - Theme Tester</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --text-color: #f3f4f6;
            --subtext-color: #9ca3af;
            --img-size: 44px;
            --wheel-radius: 110px;
            --item-height: 56px;
        }

        /* --- СТИЛИ ТЕМ (Theme Switcher Preset) --- */
        body.theme-neon {
            --bg-color: #0d0e15;
            --accent-color: #ff3366;
            --accent-glow: rgba(255, 51, 102, 0.45);
            --img-size: 52px;
            --wheel-radius: 125px;
            --item-height: 58px;
        }

        body.theme-cyber {
            --bg-color: #050b14;
            --accent-color: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --img-size: 42px;
            --wheel-radius: 100px;
            --item-height: 50px;
        }

        body.theme-clean {
            --bg-color: #121212;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.3);
            --img-size: 46px;
            --wheel-radius: 135px;
            --item-height: 54px;
        }

        body.theme-bigfocus {
            --bg-color: #0a0a0c;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --img-size: 64px;
            --wheel-radius: 140px;
            --item-height: 68px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            overflow: hidden;
            transition: background-color 0.4s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            padding-bottom: 20px;
        }

        /* Панель переключателя тем */
        .theme-switcher-bar {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .theme-btn {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Ambient Light */
        .ambient-light {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: all 0.5s ease;
            filter: blur(40px);
        }

        header {
            position: relative;
            z-index: 10;
            padding: 12px 16px 6px;
            text-align: center;
        }

        header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .picker-section {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Tabs Switcher */
        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            color: var(--subtext-color);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        /* 3D Wheel Drum */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            perspective: 900px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .wheel-wrapper:active { cursor: grabbing; }

        .wheel-selection-overlay {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            transform: translateY(-50%);
            height: calc(var(--item-height) + 6px);
            border-top: 1.5px solid var(--accent-color);
            border-bottom: 1.5px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 14px;
            transition: all 0.3s ease;
        }

        .wheel-drum {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            touch-action: none;
        }

        .wheel-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: var(--item-height);
            margin-top: calc(var(--item-height) / -2);
            margin-left: -150px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            backface-visibility: hidden;
            transition: height 0.3s ease, margin 0.3s ease, border-color 0.3s ease;
        }

        /* Картинка девайса */
        .wheel-item-img {
            height: var(--img-size);
            width: auto;
            max-width: 60px;
            object-fit: contain;
            margin-right: 12px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
            pointer-events: none;
            transition: height 0.3s ease;
        }

        .wheel-item-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
            flex-shrink: 0;
        }

        .wheel-item-info {
            flex: 1;
            text-align: left;
            overflow: hidden;
        }

        .wheel-item-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wheel-item-sub {
            font-size: 11px;
            color: var(--subtext-color);
            margin-top: 2px;
        }

        .wheel-item-price {
            font-size: 15px;
            font-weight: 800;
            color: #34d399;
            flex-shrink: 0;
            margin-left: 10px;
        }

        /* Order Info Card */
        .info-card {
            margin: 0 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .info-details h3 { font-size: 15px; font-weight: 700; }
        .info-details p { font-size: 12px; color: var(--subtext-color); margin-top: 3px; }

        .btn-order {
            padding: 14px 22px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-color), #3b0764);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            outline: none;
            transition: all 0.2s ease;
        }

        .btn-order:active { transform: scale(0.95); }
    </style>
</head>
<body class="theme-neon">

    <!-- Тест-панель стилей -->
    <div class="theme-switcher-bar">
        <button class="theme-btn active" onclick="setTheme('neon', this)">1. Neon</button>
        <button class="theme-btn" onclick="setTheme('cyber', this)">2. Cyber</button>
        <button class="theme-btn" onclick="setTheme('clean', this)">3. Clean</button>
        <button class="theme-btn" onclick="setTheme('bigfocus', this)">4. Big Focus</button>
    </div>

    <div class="ambient-light" id="ambientLight"></div>

    <header>
        <h1>Каталог Товаров</h1>
    </header>

    <div class="picker-section">
        <div class="tabs">
            <div class="tab active" id="tabModel" onclick="switchTab('model')">1. Устройство</div>
            <div class="tab" id="tabFlavor" onclick="switchTab('flavor')">2. Вкус</div>
        </div>

        <div class="wheel-wrapper" id="wheelContainer">
            <div class="wheel-selection-overlay"></div>
            <div class="wheel-drum" id="wheelDrum"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-details">
            <h3 id="summaryTitle">Загрузка...</h3>
            <p id="summarySub">Выберите параметры</p>
        </div>
        <button class="btn-order" id="actionBtn" onclick="handleAction()">Далее</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); tg.ready(); }

        let catalog = [
            {
                "id": "m1",
                "name": "soPRO-20000",
                "puffs": "20 000 затяжек",
                "price": "15 000 ₸",
                "image": "sopro20000.png",
                "flavors": [
                    { "id": "f101", "name": "Арбуз с ЧЗ", "color": "#ef4444", "bgGlow": "rgba(239, 68, 68, 0.4)" },
                    { "id": "f102", "name": "Черника Малина с ЧЗ", "color": "#3b82f6", "bgGlow": "rgba(59, 130, 246, 0.4)" },
                    { "id": "f103", "name": "Мята с ЧЗ", "color": "#10b981", "bgGlow": "rgba(16, 185, 129, 0.4)" }
                ]
            },
            {
                "id": "m2",
                "name": "PA-10000",
                "puffs": "10 000 затяжек",
                "price": "12 000 ₸",
                "image": "pa10000.png",
                "flavors": [
                    { "id": "f201", "name": "Арбуз с ЧЗ", "color": "#ef4444", "bgGlow": "rgba(239, 68, 68, 0.4)" },
                    { "id": "f202", "name": "Клубника Банан с ЧЗ", "color": "#f59e0b", "bgGlow": "rgba(245, 158, 11, 0.4)" },
                    { "id": "f203", "name": "Манго Персик с ЧЗ", "color": "#f97316", "bgGlow": "rgba(249, 115, 22, 0.4)" }
                ]
            },
            {
                "id": "m3",
                "name": "Slim-8000",
                "puffs": "8 000 затяжек",
                "price": "8 500 ₸",
                "image": "slim8000.png",
                "flavors": [
                    { "id": "f301", "name": "Клубника Арбуз", "color": "#f43f5e", "bgGlow": "rgba(244, 63, 94, 0.4)" },
                    { "id": "f302", "name": "Ананас со льдом", "color": "#eab308", "bgGlow": "rgba(234, 179, 8, 0.4)" }
                ]
            }
        ];

        let currentTab = 'model';
        let selectedModelIndex = 0;
        let selectedFlavorIndex = 0;

        let currentAngle = 0;
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let lastSelectedIndex = -1;

        const drum = document.getElementById('wheelDrum');
        const container = document.getElementById('wheelContainer');

        fetch('catalog.json')
            .then(res => res.json())
            .then(data => { if (data && data.length) { catalog = data; renderDrum(); } })
            .catch(() => renderDrum());

        function setTheme(themeName, btnEl) {
            document.body.className = `theme-${themeName}`;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderDrum();
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function getWheelRadius() {
            const style = getComputedStyle(document.body);
            return parseInt(style.getPropertyValue('--wheel-radius')) || 110;
        }

        function renderDrum() {
            drum.innerHTML = '';
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const itemCount = items.length;
            
            const angleStep = 360 / Math.max(itemCount, 8); 
            const radius = getWheelRadius();

            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'wheel-item';
                
                const itemAngle = index * angleStep;
                el.style.transform = `rotateX(${-itemAngle}deg) translateZ(${radius}px)`;

                if (currentTab === 'model') {
                    const imgHtml = item.image ? `<img class="wheel-item-img" src="${item.image}" alt="${item.name}">` : '';
                    el.innerHTML = `
                        ${imgHtml}
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">${item.puffs}</div>
                        </div>
                        <div class="wheel-item-price">${item.price}</div>
                    `;
                } else {
                    el.innerHTML = `
                        <div class="wheel-item-icon" style="background:${item.color}; color:${item.color};"></div>
                        <div class="wheel-item-info" style="margin-left: 12px;">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">В наличии</div>
                        </div>
                    `;
                }
                drum.appendChild(el);
            });

            const activeIndex = currentTab === 'model' ? selectedModelIndex : selectedFlavorIndex;
            currentAngle = activeIndex * angleStep;
            updateDrumTransform();
        }

        function updateDrumTransform() {
            drum.style.transform = `rotateX(${currentAngle}deg)`;
            
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            
            let normalizedAngle = (currentAngle % 360 + 360) % 360;
            let activeIdx = Math.round(normalizedAngle / angleStep) % items.length;

            if (activeIdx !== lastSelectedIndex) {
                lastSelectedIndex = activeIdx;
                triggerHaptic();

                if (currentTab === 'model') {
                    selectedModelIndex = activeIdx;
                    selectedFlavorIndex = 0;
                } else {
                    selectedFlavorIndex = activeIdx;
                }
                updateSummary();
            }
        }

        function updateSummary() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            document.getElementById('summaryTitle').innerText = model.name;
            document.getElementById('summarySub').innerText = `Вкус: ${flavor.name} • ${model.price}`;

            const btn = document.getElementById('actionBtn');
            btn.innerText = currentTab === 'model' ? 'Выбрать вкус →' : 'Оплатить';
        }

        function switchTab(tab) {
            triggerHaptic();
            currentTab = tab;
            document.getElementById('tabModel').classList.toggle('active', tab === 'model');
            document.getElementById('tabFlavor').classList.toggle('active', tab === 'flavor');
            lastSelectedIndex = -1;
            renderDrum();
        }

        function handleAction() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            if (currentTab === 'model') {
                switchTab('flavor');
            } else {
                submitOrder();
            }
        }

        function startDrag(clientY) {
            isDragging = true;
            startY = clientY;
            drum.style.transition = 'none';
        }

        function moveDrag(clientY) {
            if (!isDragging) return;
            currentY = clientY;
            const deltaY = startY - currentY;
            currentAngle += deltaY * 0.35;
            startY = currentY;
            updateDrumTransform();
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            snapToItem();
        }

        container.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientY), { passive: true });
        container.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientY), { passive: true });
        container.addEventListener('touchend', stopDrag);

        container.addEventListener('mousedown', (e) => startDrag(e.clientY));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
        window.addEventListener('mouseup', stopDrag);

        function snapToItem() {
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            currentAngle = Math.round(currentAngle / angleStep) * angleStep;
            drum.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1)';
            updateDrumTransform();
        }

        function submitOrder() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            const orderData = {
                model_id: model.id,
                model_name: model.name,
                flavor_id: flavor.id,
                flavor_name: flavor.name,
                price: model.price
            };

            if (tg) {
                tg.sendData(JSON.stringify(orderData));
            } else {
                alert(`Заказ: ${model.name} (${flavor.name}) — ${model.price}`);
            }
        }

        renderDrum();
    </script>
</body>
</html>
