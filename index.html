<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>РАЗКИ КОСТАНАЙ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-color: #0d0d11;
            --text-color: #ffffff;
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 15px 0;
        }

        /* Двужильный неон: РАЗКИ розовый, КОСТАНАЙ голубой */
        header {
            text-align: center;
            z-index: 10;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .logo-rasky {
            color: #fff;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
        }

        .logo-kostanay {
            color: #fff;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px var(--neon-blue),
                0 0 20px var(--neon-blue),
                0 0 40px var(--neon-blue),
                0 0 80px var(--neon-blue);
            margin-top: 4px;
        }

        header p {
            font-size: 13px;
            color: #8a8a9e;
            margin-top: 6px;
        }

        .step-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
        }

        .step {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .swiper {
            width: 100%;
            padding-top: 5px;
            padding-bottom: 25px;
        }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 260px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .device-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .device-card img {
            width: 150px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .swiper-slide-active .device-card img {
            transform: scale(1.06);
        }

        .device-title {
            margin-top: 10px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            padding: 0 10px;
        }

        .device-puffs {
            font-size: 13px;
            color: var(--neon-blue);
            font-weight: 600;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        .device-price {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 800;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .neon-podium {
            width: 220px;
            height: 15px;
            border-radius: 50%;
            background: var(--neon-color);
            box-shadow: 0 0 25px 8px var(--neon-glow), 0 0 50px 15px var(--neon-glow);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            margin-top: -10px;
            z-index: 2;
        }

        .flavor-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            width: 82%;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .swiper-slide-active .flavor-card {
            border-color: var(--neon-color);
            box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(255, 255, 255, 0.1);
            transform: scale(1.03);
        }

        .flavor-name {
            font-size: 21px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        .flavor-stock {
            font-size: 13px;
            color: #39ff14;
            font-weight: 600;
            margin-top: 12px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            padding: 6px 14px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .order-form-container {
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .form-label {
            font-size: 12px;
            color: #b0b0c3;
            font-weight: 600;
            padding-left: 4px;
        }

        .phone-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .country-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 6px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            min-width: 95px;
        }

        .country-select option {
            background: #1a1a24;
            color: #fff;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-blue);
        }

        .form-hint {
            font-size: 11px;
            color: #8a8a9e;
            padding-left: 4px;
            line-height: 1.2;
        }

        /* Выпадающий список подсказок адресов */
        .address-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #181822;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            margin-top: 4px;
            z-index: 100;
            max-height: 160px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .suggestion-item {
            padding: 10px 14px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: rgba(0, 243, 255, 0.15);
        }

        .btn-geo {
            background: rgba(0, 243, 255, 0.1);
            border: 1px dashed var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-geo:active {
            background: rgba(0, 243, 255, 0.25);
        }

        .payment-notice {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #00f3ff;
            text-align: center;
            font-weight: 600;
        }

        .btn-action {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 15px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: transform 0.2s ease;
            margin-top: 10px;
            z-index: 10;
            width: 85%;
            max-width: 320px;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-back:active {
            transform: scale(0.95);
        }
        
        .loading {
            color: #8a8a9e;
            font-size: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span class="logo-rasky">РАЗКИ</span>
            <span class="logo-kostanay">КОСТАНАЙ</span>
        </h1>
        <p id="step-subtitle">Шаг 1: Выберите устройство</p>
    </header>

    <div class="step-container">
        <!-- ШАГ 1: ВЫБОР УСТРОЙСТВА -->
        <div class="step active" id="step-device">
            <div class="swiper deviceSwiper">
                <div class="swiper-wrapper" id="device-list">
                    <div class="swiper-slide"><div class="loading">Загрузка каталога...</div></div>
                </div>
            </div>
            <button class="btn-action" onclick="confirmDevice()">Выбрать устройство</button>
        </div>

        <!-- ШАГ 2: ВЫБОР ВКУСА -->
        <div class="step" id="step-flavor">
            <button class="btn-back" onclick="goBackToDevices()">← Назад к устройствам</button>
            <div class="swiper flavorSwiper">
                <div class="swiper-wrapper" id="flavor-list"></div>
            </div>
            <div class="neon-podium" id="neon-glow"></div>
            <button class="btn-action" onclick="confirmFlavor()">Выбрать вкус</button>
        </div>

        <!-- ШАГ 3: ОФОРМЛЕНИЕ ЗАКАЗА -->
        <div class="step" id="step-order">
            <button class="btn-back" onclick="goBackToFlavors()">← Назад к вкусам</button>
            
            <div class="order-form-container">
                <div class="form-group">
                    <label class="form-label">Введите ваше имя</label>
                    <input type="text" id="cust-name" placeholder="Например, Алексей">
                </div>

                <div class="form-group">
                    <label class="form-label">Номер телефона WhatsApp</label>
                    <div class="phone-input-wrapper">
                        <select id="country-code" class="country-select" onchange="updatePhonePlaceholder()">
                            <option value="+7" selected>🇰🇿 +7</option>
                            <option value="+7">🇷🇺 +7</option>
                            <option value="+996">🇰🇬 +996</option>
                            <option value="+998">🇺🇿 +998</option>
                            <option value="+375">🇧🇾 +375</option>
                        </select>
                        <input type="tel" id="cust-phone" placeholder="(705) 123-45-67" maxlength="15">
                    </div>
                    <span class="form-hint">Курьер свяжется с вами посредством аудиозвонка на WhatsApp. Указывайте зарегистрированный номер.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Адрес доставки</label>
                    <input type="text" id="cust-address" placeholder="Например: Абая, Баймагамбетова, 9 мкр" autocomplete="off" oninput="handleAddressInput()">
                    <div id="address-suggestions" class="address-suggestions"></div>
                    <button type="button" class="btn-geo" onclick="requestGeolocation()">📍 Определить моё местоположение</button>
                    <span class="form-hint">Поиск улиц и микрорайонов по г. Костанай и области.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Комментарий (необязательно)</label>
                    <input type="text" id="cust-comment" placeholder="Подъезд, этаж, домофон">
                </div>

                <div class="payment-notice">
                    💵 Оплата исключительно наличными при получении
                </div>
            </div>

            <button class="btn-action" id="submit-btn" onclick="submitOrder()">Оформить заказ</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const API_BASE_URL = "https://warm-heads-throw.loca.lt";

        const deviceImages = {
            "WAKA soPRO BOOST 20000": "https://raw.githubusercontent.com/maker17707/shop/main/sopro20000.png",
            "PA 10000": "https://raw.githubusercontent.com/maker17707/shop/main/pa10000.png",
            "Slim 8000": "https://raw.githubusercontent.com/maker17707/shop/main/slim8000.png"
        };

        const flavorColors = {
            "КЛУБНИКА, МАЛИНА": "#ff2a6d",
            "ПЕРСИК, МАЛИНА": "#ff7700",
            "ЧЕРНИКА, МАЛИНА, МЕТОЛ": "#7b2cbf",
            "АРБУЗ": "#00ff66",
            "КЛУБНИКА, КИВИ": "#b4ff39",
            "ЕЖЕВИКА, ЧЕРНИКА, МАЛИНА": "#4361ee",
            "КЛУБНИКА, АРБУЗ": "#ff0054",
            "АРБУЗ, ВИШНЯ": "#d90429",
            "САКУРА, ВИНОГРАД": "#9d4edd",
            "КИВИ, МАРАКУЙЯ, ГУАВА": "#ffb703"
        };

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let catalogData = [];
        let selectedDevice = null;
        let selectedFlavor = null;
        let deviceSwiper = null;
        let flavorSwiper = null;
        let searchTimeout = null;

        function extractPuffs(name) {
            const match = name.match(/\d+/g);
            if (match) {
                const numbers = match.map(Number);
                const maxNum = Math.max(...numbers);
                if (maxNum > 100) return `${maxNum} затяжек`;
            }
            return "";
        }

        async function loadCatalog() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера');
                catalogData = await response.json();
                renderDevices();
            } catch (error) {
                console.error('Не удалось загрузить каталог:', error);
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Ошибка загрузки каталога</div></div>';
            }
        }

        function renderDevices() {
            if (!catalogData.length) {
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Нет товаров в наличии</div></div>';
                return;
            }

            const container = document.getElementById('device-list');
            container.innerHTML = catalogData.map(dev => {
                const imageUrl = deviceImages[dev.name] || 'https://via.placeholder.com/150x170/1a1a24/ffffff?text=' + encodeURIComponent(dev.name);
                const puffsText = extractPuffs(dev.name);
                
                return `
                <div class="swiper-slide">
                    <div class="device-card">
                        <img src="${imageUrl}" alt="${dev.name}">
                        <div class="device-title">${dev.name}</div>
                        ${puffsText ? `<div class="device-puffs">${puffsText}</div>` : ''}
                        <div class="device-price">${dev.price}</div>
                    </div>
                </div>
                `;
            }).join('');

            deviceSwiper = new Swiper('.deviceSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 35, stretch: 0, depth: 160, modifier: 1, slideShadows: false },
                on: { slideChange: () => triggerHaptic() }
            });
        }

        function renderFlavors(flavors) {
            const container = document.getElementById('flavor-list');
            container.innerHTML = flavors.map(fl => {
                const upperName = fl.name.toUpperCase().trim();
                const color = flavorColors[upperName] || '#00f3ff';
                
                return `
                <div class="swiper-slide">
                    <div class="flavor-card" style="background: linear-gradient(135deg, ${color}25, rgba(255,255,255,0.03));">
                        <div class="flavor-name">${fl.name}</div>
                        <div class="flavor-stock">✓ В наличии</div>
                    </div>
                </div>
            `;
            }).join('');

            if (flavorSwiper) flavorSwiper.destroy();

            flavorSwiper = new Swiper('.flavorSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 30, stretch: 0, depth: 120, modifier: 1, slideShadows: false },
                on: {
                    init: function () { updateNeonGlow(flavors[this.activeIndex]); },
                    slideChange: function () {
                        triggerHaptic();
                        updateNeonGlow(flavors[this.activeIndex]);
                    }
                }
            });
        }

        function updateNeonGlow(flavor) {
            if (!flavor) return;
            const podium = document.getElementById('neon-glow');
            const upperName = flavor.name.toUpperCase().trim();
            const color = flavorColors[upperName] || '#00f3ff';
            
            podium.style.setProperty('--neon-color', color);
            podium.style.setProperty('--neon-glow', color + 'cc');
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function updatePhonePlaceholder() {
            const code = document.getElementById('country-code').value;
            const phoneInput = document.getElementById('cust-phone');
            if (code === '+7') phoneInput.placeholder = "(705) 123-45-67";
            else if (code === '+996') phoneInput.placeholder = "(555) 123-456";
            else if (code === '+998') phoneInput.placeholder = "(90) 123-45-67";
            else phoneInput.placeholder = "123-456-789";
        }

        // Живой геопоиск улиц/микрорайонов в Костанае через OpenStreetMap Nominatim
        function handleAddressInput() {
            const input = document.getElementById('cust-address');
            const suggestionsBox = document.getElementById('address-suggestions');
            const query = input.value.trim();

            clearTimeout(searchTimeout);

            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                suggestionsBox.innerHTML = '';
                return;
            }

            // Задержка 300мс, чтобы не слать запросы на каждый символ при быстром наборе
            searchTimeout = setTimeout(async () => {
                try {
                    // Ищем по запросу с привязкой к Костанаю (город + область)
                    const searchQuery = encodeURIComponent(`${query}, Костанай, Казахстан`);
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${searchQuery}&countrycodes=kz&limit=5&accept-language=ru`);
                    const data = await response.json();

                    if (!data || data.length === 0) {
                        suggestionsBox.style.display = 'none';
                        return;
                    }

                    suggestionsBox.innerHTML = data.map(item => `
                        <div class="suggestion-item" onclick="selectAddress('${item.display_name.replace(/'/g, "\\'")}')">${item.display_name}</div>
                    `).join('');
                    suggestionsBox.style.display = 'block';
                } catch (e) {
                    console.error('Ошибка геопоиска:', e);
                }
            }, 300);
        }

        function selectAddress(address) {
            document.getElementById('cust-address').value = address;
            document.getElementById('address-suggestions').style.display = 'none';
        }

        // Автоопределение геолокации по GPS устройства
        function requestGeolocation() {
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается вашим устройством');
                return;
            }

            const addrInput = document.getElementById('cust-address');
            addrInput.placeholder = 'Определяем местоположение...';

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ru`);
                    const data = await response.json();
                    if (data && data.display_name) {
                        addrInput.value = data.display_name;
                    } else {
                        addrInput.value = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    }
                } catch (e) {
                    addrInput.value = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                }
                addrInput.placeholder = 'Например: Абая, Баймагамбетова, 9 мкр';
            }, (error) => {
                alert('Не удалось получить координаты. Проверьте разрешения.');
                addrInput.placeholder = 'Например: Абая, Баймагамбетова, 9 мкр';
            }, { timeout: 10000 });
        }

        function confirmDevice() {
            if (!catalogData.length) return;
            selectedDevice = catalogData[deviceSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
            renderFlavors(selectedDevice.flavors);
        }

        function goBackToDevices() {
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
        }

        function confirmFlavor() {
            selectedFlavor = selectedDevice.flavors[flavorSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = 'Оформление заказа';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-order').classList.add('active');
        }

        function goBackToFlavors() {
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-order').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const countryCode = document.getElementById('country-code').value;
            const rawPhone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const comment = document.getElementById('cust-comment').value.trim();

            if (!name || !rawPhone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес!');
                return;
            }

            const phone = countryCode + rawPhone.replace(/[^\d]/g, '');

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            const cleanPrice = parseFloat(selectedDevice.price.replace(/[^\d]/g, '')) || 0;

            const orderData = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: [
                    {
                        model: selectedDevice.name,
                        flavor: selectedFlavor.name,
                        quantity: 1,
                        selling_price: cleanPrice
                    }
                ],
                total_price: cleanPrice,
                payment_type: "Наличные при получении",
                comment: comment
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`✅ Заказ #${result.order_id} успешно оформлен! Ожидайте аудиозвонок курьера на WhatsApp.`);
                    if (tg) tg.close();
                } else {
                    alert('Ошибка при оформлении заказа. Попробуйте еще раз.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Оформление заказа';
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка соединения с сервером.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Оформление заказа';
            }
        }

        loadCatalog();
    </script>
</body>
</html>
