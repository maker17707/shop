<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Vaka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .step-card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            display: none;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .step-card.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* iOS-стиль барабана (picker) */
        .ios-picker-wrapper {
            position: relative;
            height: 180px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 15px;
        }

        /* Центральная подсветка барабана */
        .ios-picker-highlight {
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            transform: translateY(-50%);
            height: 50px;
            background: rgba(56, 189, 248, 0.15);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            pointer-events: none;
            z-index: 2;
        }

        .ios-picker-list {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: scroll;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            padding: 65px 0; /* Центрирование элементов */
            z-index: 1;
        }

        .ios-picker-list::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .ios-picker-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #94a3b8;
            transition: all 0.15s ease;
            cursor: pointer;
            text-align: center;
            padding: 0 10px;
        }

        .ios-picker-item.selected {
            color: #38bdf8;
            font-size: 18px;
            font-weight: 800;
            transform: scale(1.05);
        }

        /* Контейнер для картинки выбранного устройства */
        .device-preview-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .device-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px;
            margin: 0 auto;
            display: block;
        }

        .price-tag {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            background: rgba(255,255,255,0.05);
            color: inherit;
        }

        .main-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }
        .main-btn:active { background: #0ea5e9; }

        .secondary-btn {
            background: #475569;
            color: #fff;
            margin-top: 8px;
        }
        .secondary-btn:active { background: #334155; }

        .summary-box {
            font-size: 14px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛍️ Магазин Vaka</h1>

        <!-- ШАГ 1: Барабан устройств (iOS стиль) -->
        <div id="step-device" class="step-card active">
            <h2>🎰 Выберите устройство</h2>
            
            <!-- Картинка выбранного устройства -->
            <div class="device-preview-container">
                <img id="device-img" class="device-image" src="" alt="Устройство" onerror="this.style.display='none'">
            </div>
            
            <div id="device-price" class="price-tag">0 ₸</div>

            <!-- iOS Колесо прокрутки -->
            <div class="ios-picker-wrapper">
                <div class="ios-picker-highlight"></div>
                <div id="device-picker-list" class="ios-picker-list" onscroll="handleDeviceScroll()"></div>
            </div>

            <button class="main-btn" onclick="confirmDevice()">Выбрать устройство</button>
        </div>

        <!-- ШАГ 2: Барабан вкусов (iOS стиль) -->
        <div id="step-flavor" class="step-card">
            <h2>🍏 Выберите вкус</h2>
            <div id="selected-device-info" class="summary-box"></div>

            <!-- iOS Колесо прокрутки для вкусов -->
            <div class="ios-picker-wrapper">
                <div class="ios-picker-highlight"></div>
                <div id="flavor-picker-list" class="ios-picker-list" onscroll="handleFlavorScroll()"></div>
            </div>

            <label for="qty-input" style="font-size: 13px; color: #94a3b8;">Количество:</label>
            <input type="number" id="qty-input" value="1" min="1" max="10">

            <button class="main-btn" onclick="goToCheckout()">Перейти к оформлению</button>
            <button class="main-btn secondary-btn" onclick="showStep('step-device')">Назад</button>
        </div>

        <!-- ШАГ 3: Оформление заказа -->
        <div id="step-checkout" class="step-card">
            <h2>📦 Оформление заказа</h2>
            <div id="order-summary" class="summary-box"></div>

            <input type="text" id="cust-name" placeholder="Ваше Имя">
            <input type="text" id="cust-phone" placeholder="Телефон WhatsApp (+7700...)">
            <input type="text" id="cust-address" placeholder="Адрес доставки">
            <input type="text" id="cust-comment" placeholder="Комментарий (необязательно)">

            <p style="text-align: center; font-size: 18px; margin: 15px 0;"><strong>Итого: <span id="total-price" style="color: #4ade80;">0</span> ₸</strong></p>

            <button class="main-btn" onclick="submitOrder()">Отправить заказ</button>
            <button class="main-btn secondary-btn" onclick="showStep('step-flavor')">Назад</button>
        </div>
    </div>

    <script>
        const API_URL = "https://nine-socks-own.loca.lt";

        let catalogData = [];
        let selectedDeviceIndex = 0;
        let selectedFlavorIndex = 0;
        let finalCartItem = null;

        const ITEM_HEIGHT = 50; // Высота одного элемента в пикселях

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function loadCatalog() {
            try {
                let response = await fetch(`${API_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера');
                
                catalogData = await response.json();

                if (!catalogData || catalogData.length === 0) {
                    alert('Товары закончились');
                    return;
                }

                renderDevicePicker();
                updateDeviceSelection(0);
            } catch (err) {
                console.error(err);
                alert('Не удалось подключиться к серверу каталога.');
            }
        }

        // --- РЕНДЕР БАРАБАНА УСТРОЙСТВ ---
        function renderDevicePicker() {
            let list = document.getElementById('device-picker-list');
            list.innerHTML = '';
            
            catalogData.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = `ios-picker-item ${index === 0 ? 'selected' : ''}`;
                div.innerText = item.name;
                div.onclick = () => scrollToDevice(index);
                list.appendChild(div);
            });
        }

        function scrollToDevice(index) {
            let list = document.getElementById('device-picker-list');
            list.scrollTo({ top: index * ITEM_HEIGHT, behavior: 'smooth' });
        }

        function handleDeviceScroll() {
            let list = document.getElementById('device-picker-list');
            let index = Math.round(list.scrollTop / ITEM_HEIGHT);
            if (index >= 0 && index < catalogData.length && index !== selectedDeviceIndex) {
                updateDeviceSelection(index);
            }
        }

        function updateDeviceSelection(index) {
            selectedDeviceIndex = index;
            let item = catalogData[index];

            // Обновляем визуальное выделение элементов в списке
            let items = document.querySelectorAll('#device-picker-list .ios-picker-item');
            items.forEach((el, idx) => {
                if (idx === index) el.classList.add('selected');
                else el.classList.remove('selected');
            });

            // Обновляем цену
            document.getElementById('device-price').innerText = `${item.price} ₸`;

            // Обновляем картинку с защитой от путей
            let imgElement = document.getElementById('device-img');
            if (item.image_url) {
                let imgUrl = item.image_url.startsWith('http') ? item.image_url : API_URL + item.image_url;
                imgElement.src = imgUrl;
                imgElement.style.display = 'block';
            } else {
                imgElement.src = '';
                imgElement.style.display = 'none';
            }
        }

        function confirmDevice() {
            let device = catalogData[selectedDeviceIndex];
            document.getElementById('selected-device-info').innerText = `${device.name} — ${device.price} ₸`;

            renderFlavorPicker(device.flavors);
            showStep('step-flavor');
            updateFlavorSelection(0);
        }

        // --- РЕНДЕР БАРАБАНА ВКУСОВ ---
        let currentFlavors = [];

        function renderFlavorPicker(flavors) {
            let list = document.getElementById('flavor-picker-list');
            list.innerHTML = '';
            currentFlavors = flavors && flavors.length > 0 ? flavors : [{ name: "Стандарт", stock: 10 }];

            currentFlavors.forEach((f, index) => {
                let div = document.createElement('div');
                div.className = `ios-picker-item ${index === 0 ? 'selected' : ''}`;
                div.innerText = `${f.name} (остаток: ${f.stock})`;
                div.onclick = () => scrollToFlavor(index);
                list.appendChild(div);
            });
        }

        function scrollToFlavor(index) {
            let list = document.getElementById('flavor-picker-list');
            list.scrollTo({ top: index * ITEM_HEIGHT, behavior: 'smooth' });
        }

        function handleFlavorScroll() {
            let list = document.getElementById('flavor-picker-list');
            let index = Math.round(list.scrollTop / ITEM_HEIGHT);
            if (index >= 0 && index < currentFlavors.length && index !== selectedFlavorIndex) {
                updateFlavorSelection(index);
            }
        }

        function updateFlavorSelection(index) {
            selectedFlavorIndex = index;
            let items = document.querySelectorAll('#flavor-picker-list .ios-picker-item');
            items.forEach((el, idx) => {
                if (idx === index) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function goToCheckout() {
            let device = catalogData[selectedDeviceIndex];
            let flavor = currentFlavors[selectedFlavorIndex];
            let quantity = parseInt(document.getElementById('qty-input').value) || 1;
            
            let numericPrice = parseFloat(String(device.price).replace(/[^0-9.]/g, '')) || 0;
            let total = numericPrice * quantity;

            finalCartItem = {
                model: device.name,
                flavor: flavor.name,
                quantity: quantity,
                selling_price: numericPrice
            };

            document.getElementById('order-summary').innerText = `${device.name} / ${flavor.name} — ${quantity} шт.`;
            document.getElementById('total-price').innerText = total.toLocaleString();

            showStep('step-checkout');
        }

        function showStep(stepId) {
            document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        async function submitOrder() {
            let name = document.getElementById('cust-name').value.trim();
            let phone = document.getElementById('cust-phone').value.trim();
            let address = document.getElementById('cust-address').value.trim();
            let comment = document.getElementById('cust-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес доставки!');
                return;
            }

            let total = finalCartItem.selling_price * finalCartItem.quantity;

            let orderPayload = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: [finalCartItem],
                total_price: total,
                payment_type: "Наличные/Перевод",
                comment: comment
            };

            try {
                let response = await fetch(`${API_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                
                let result = await response.json();
                if (response.ok) {
                    alert('🎉 Заказ успешно оформлен! Спасибо.');
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    } else {
                        location.reload();
                    }
                } else {
                    alert('Ошибка: ' + (result.detail || 'Не удалось создать заказ'));
                }
            } catch (err) {
                console.error(err);
                alert('Не удалось отправить заказ.');
            }
        }

        loadCatalog();
    </script>
</body>
</html>
