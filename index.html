<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Wheel Catalog</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --text-color: #f3f4f6;
            --subtext-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ИСПРАВЛЕНО: Включен вертикальный скролл страницы */
        html, body {
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            padding-bottom: 20px;
        }

        /* Ambient Backlight Glow */
        .ambient-light {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 75%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
            filter: blur(35px);
        }

        header {
            position: relative;
            z-index: 10;
            padding: 16px 16px 8px;
            text-align: center;
        }

        header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 40%, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tabs Switcher */
        .picker-section {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 3px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab {
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 13px;
            color: var(--subtext-color);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        /* Wheel Wrapper & Drum */
        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            perspective: 800px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-selection-overlay {
            position: absolute;
            top: 50%;
            left: 8%;
            right: 8%;
            transform: translateY(-50%);
            height: 52px;
            border-top: 1.5px solid var(--accent-color);
            border-bottom: 1.5px solid var(--accent-color);
            background: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 12px var(--accent-glow);
            border-radius: 10px;
        }

        .wheel-drum {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            touch-action: none;
        }

        /* Wheel Item Style */
        .wheel-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 48px;
            margin-top: -24px;
            margin-left: -125px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            backface-visibility: hidden;
        }

        .wheel-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
        }

        .wheel-item-info {
            flex: 1;
            margin-left: 12px;
            text-align: left;
        }

        .wheel-item-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }

        .wheel-item-sub {
            font-size: 11px;
            color: var(--subtext-color);
        }

        .wheel-item-price {
            font-size: 14px;
            font-weight: 800;
            color: #34d399;
        }

        /* Footer Action */
        .info-card {
            margin: 0 16px 16px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .info-details h3 { font-size: 15px; font-weight: 700; }
        .info-details p { font-size: 12px; color: var(--subtext-color); margin-top: 2px; }

        .btn-order {
            padding: 12px 22px;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-color), #4c1d95);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            outline: none;
        }
    </style>
</head>
<body>

    <div class="ambient-light" id="ambientLight"></div>

    <header>
        <h1>CyberVape Store</h1>
    </header>

    <div class="picker-section">
        <div class="tabs">
            <div class="tab active" id="tabModel" onclick="switchTab('model')">1. Устройство</div>
            <div class="tab" id="tabFlavor" onclick="switchTab('flavor')">2. Вкус</div>
        </div>

        <div class="wheel-wrapper" id="wheelContainer">
            <div class="wheel-selection-overlay"></div>
            <div class="wheel-drum" id="wheelDrum"></div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-details">
            <h3 id="summaryTitle">ElfBar 10000</h3>
            <p id="summarySub">Выберите вкус</p>
        </div>
        <button class="btn-order" onclick="submitOrder()">В корзину</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); tg.ready(); }

        const catalog = [
            {
                id: "m1",
                name: "ElfBar BC10000",
                puffs: "10 000 тяг",
                price: "7 500 ₸",
                image: "https://pngimg.com/uploads/vape/vape_PNG37.png",
                flavors: [
                    { id: "f11", name: "Черника Лёд", color: "#3b82f6", bgGlow: "rgba(59, 130, 246, 0.35)", icon: "https://png.pngtree.com/png-clipart/20230114/ourmid/pngtree-blueberry-fruit-transparent-background-png-image_6561565.png" },
                    { id: "f12", name: "Кислая Малина", color: "#ef4444", bgGlow: "rgba(239, 68, 68, 0.35)", icon: "https://png.pngtree.com/png-clipart/20230114/ourmid/pngtree-raspberry-fruit-png-image_6561566.png" },
                    { id: "f13", name: "Арбуз Мята", color: "#10b981", bgGlow: "rgba(16, 185, 129, 0.35)", icon: "https://png.pngtree.com/png-clipart/20230114/ourmid/pngtree-watermelon-png-image_6561567.png" }
                ]
            },
            {
                id: "m2",
                name: "Lost Mary 16000",
                puffs: "16 000 тяг",
                price: "9 000 ₸",
                image: "https://pngimg.com/uploads/vape/vape_PNG37.png",
                flavors: [
                    { id: "f21", name: "Двойное Яблоко", color: "#22c55e", bgGlow: "rgba(34, 197, 94, 0.35)", icon: "" },
                    { id: "f22", name: "Клубника Банан", color: "#f59e0b", bgGlow: "rgba(245, 158, 11, 0.35)", icon: "" }
                ]
            }
        ];

        let currentTab = 'model';
        let selectedModelIndex = 0;
        let selectedFlavorIndex = 0;

        let currentAngle = 0;
        let startY = 0;
        let currentY = 0;
        let isDragging = false;
        let lastSelectedIndex = -1;

        const drum = document.getElementById('wheelDrum');
        const container = document.getElementById('wheelContainer');

        function renderDrum() {
            drum.innerHTML = '';
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const itemCount = items.length;
            
            const angleStep = 360 / Math.max(itemCount, 8); 
            const radius = 85; 

            items.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'wheel-item';
                
                const itemAngle = index * angleStep;
                el.style.transform = `rotateX(${-itemAngle}deg) translateZ(${radius}px)`;

                if (currentTab === 'model') {
                    el.innerHTML = `
                        <img src="${item.image}" alt="vape">
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">${item.puffs}</div>
                        </div>
                        <div class="wheel-item-price">${item.price}</div>
                    `;
                } else {
                    const iconHtml = item.icon ? `<img src="${item.icon}" alt="flavor">` : `<div style="width:16px;height:16px;border-radius:50%;background:${item.color}"></div>`;
                    el.innerHTML = `
                        ${iconHtml}
                        <div class="wheel-item-info">
                            <div class="wheel-item-title">${item.name}</div>
                            <div class="wheel-item-sub">В наличии</div>
                        </div>
                    `;
                }
                drum.appendChild(el);
            });

            const activeIndex = currentTab === 'model' ? selectedModelIndex : selectedFlavorIndex;
            currentAngle = activeIndex * angleStep;
            updateDrumTransform();
        }

        function updateDrumTransform() {
            drum.style.transform = `rotateX(${currentAngle}deg)`;
            
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            
            let normalizedAngle = (currentAngle % 360 + 360) % 360;
            let activeIdx = Math.round(normalizedAngle / angleStep) % items.length;

            if (activeIdx !== lastSelectedIndex) {
                lastSelectedIndex = activeIdx;
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }

                if (currentTab === 'model') {
                    selectedModelIndex = activeIdx;
                    selectedFlavorIndex = 0;
                } else {
                    selectedFlavorIndex = activeIdx;
                }
                updateSummary();
            }
        }

        function updateSummary() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            document.getElementById('summaryTitle').innerText = model.name;
            document.getElementById('summarySub').innerText = `Вкус: ${flavor.name} • ${model.price}`;

            document.documentElement.style.setProperty('--accent-color', flavor.color);
            document.documentElement.style.setProperty('--accent-glow', flavor.bgGlow);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabModel').classList.toggle('active', tab === 'model');
            document.getElementById('tabFlavor').classList.toggle('active', tab === 'flavor');
            lastSelectedIndex = -1;
            renderDrum();
        }

        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            startY = e.touches[0].clientY;
            drum.style.transition = 'none';
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = startY - currentY;
            currentAngle += deltaY * 0.35;
            startY = currentY;
            updateDrumTransform();
        }, { passive: true });

        container.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            snapToItem();
        });

        function snapToItem() {
            const items = currentTab === 'model' ? catalog : catalog[selectedModelIndex].flavors;
            const angleStep = 360 / Math.max(items.length, 8);
            currentAngle = Math.round(currentAngle / angleStep) * angleStep;
            drum.style.transition = 'transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1)';
            updateDrumTransform();
        }

        function submitOrder() {
            const model = catalog[selectedModelIndex];
            const flavor = model.flavors[selectedFlavorIndex] || model.flavors[0];

            if (tg) {
                tg.HapticFeedback.impactOccurred('medium');
                tg.sendData(JSON.stringify({
                    model_id: model.id,
                    model_name: model.name,
                    flavor_id: flavor.id,
                    flavor_name: flavor.name,
                    price: model.price
                }));
            } else {
                alert(`В корзину: ${model.name} (${flavor.name})`);
            }
        }

        renderDrum();
    </script>
</body>
</html>
