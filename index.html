<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>РАЗКИ КОСТАНАЙ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root {
            --bg-color: #0d0d11;
            --text-color: #ffffff;
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 15px 0;
        }

        /* Двужильный неон: РАЗКИ розовый, КОСТАНАЙ голубой */
        header {
            text-align: center;
            z-index: 10;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .logo-rasky {
            color: #fff;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
        }

        .logo-kostanay {
            color: #fff;
            text-shadow: 
                0 0 4px #fff,
                0 0 10px var(--neon-blue),
                0 0 20px var(--neon-blue),
                0 0 40px var(--neon-blue),
                0 0 80px var(--neon-blue);
            margin-top: 4px;
        }

        header p {
            font-size: 13px;
            color: #8a8a9e;
            margin-top: 6px;
        }

        .step-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            flex: 1;
        }

        .step {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .swiper {
            width: 100%;
            padding-top: 5px;
            padding-bottom: 25px;
        }

        .swiper-slide {
            background-position: center;
            background-size: cover;
            width: 260px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .device-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        .device-card img {
            width: 150px;
            height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .swiper-slide-active .device-card img {
            transform: scale(1.06);
        }

        .device-title {
            margin-top: 10px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            padding: 0 10px;
        }

        .device-puffs {
            font-size: 13px;
            color: var(--neon-blue);
            font-weight: 600;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
        }

        .device-price {
            margin-top: 6px;
            font-size: 18px;
            font-weight: 800;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .neon-podium {
            width: 220px;
            height: 15px;
            border-radius: 50%;
            background: var(--neon-color);
            box-shadow: 0 0 25px 8px var(--neon-glow), 0 0 50px 15px var(--neon-glow);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            margin-top: -10px;
            z-index: 2;
        }

        .flavor-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            width: 82%;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .swiper-slide-active .flavor-card {
            border-color: var(--neon-color);
            box-shadow: 0 0 25px var(--neon-glow), inset 0 0 15px rgba(255, 255, 255, 0.1);
            transform: scale(1.03);
        }

        .flavor-name {
            font-size: 21px;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.3;
        }

        .flavor-stock {
            font-size: 13px;
            color: #39ff14;
            font-weight: 600;
            margin-top: 12px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            padding: 6px 14px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .order-form-container {
            width: 90%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            color: #b0b0c3;
            font-weight: 600;
            padding-left: 4px;
        }

        .phone-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .country-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 6px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            min-width: 95px;
            text-align: center;
        }

        .country-select option {
            background: #1a1a24;
            color: #fff;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-blue);
        }

        .form-hint {
            font-size: 11px;
            color: #8a8a9e;
            padding-left: 4px;
            line-height: 1.2;
        }

        .payment-notice {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #00f3ff;
            text-align: center;
            font-weight: 600;
        }

        .btn-action {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            border: none;
            padding: 15px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: transform 0.2s ease;
            margin-top: 10px;
            z-index: 10;
            width: 85%;
            max-width: 320px;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-back:active {
            transform: scale(0.95);
        }

        .success-icon {
            font-size: 45px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
            text-align: center;
        }

        .success-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 2px;
            text-align: center;
        }

        .success-subtitle {
            font-size: 13px;
            color: var(--neon-blue);
            margin-bottom: 12px;
            font-weight: 600;
            text-align: center;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .success-card img {
            width: 60px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        .success-card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
        }

        .success-card-title {
            font-size: 14px;
            font-weight: 700;
        }

        .success-card-flavor {
            font-size: 12px;
            color: var(--neon-blue);
        }

        .success-card-price {
            font-size: 15px;
            font-weight: 800;
            color: #39ff14;
        }

        .success-buttons {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .success-buttons .btn-action {
            width: 100%;
            margin-top: 0;
            padding: 12px 20px;
            font-size: 15px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .btn-secondary:active {
            transform: scale(0.96);
        }

        .btn-danger {
            background: rgba(255, 0, 84, 0.15);
            border: 1px solid rgba(255, 0, 84, 0.4);
            color: #ff0054;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-danger:active {
            transform: scale(0.96);
        }
        
        .loading {
            color: #8a8a9e;
            font-size: 15px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span class="logo-rasky">РАЗКИ</span>
            <span class="logo-kostanay">КОСТАНАЙ</span>
        </h1>
        <p id="step-subtitle">Шаг 1: Выберите устройство</p>
    </header>

    <div class="step-container">
        <!-- ШАГ 1: ВЫБОР УСТРОЙСТВА -->
        <div class="step active" id="step-device">
            <div class="swiper deviceSwiper">
                <div class="swiper-wrapper" id="device-list">
                    <div class="swiper-slide"><div class="loading">Загрузка каталога...</div></div>
                </div>
            </div>
            <button class="btn-action" onclick="confirmDevice()">Выбрать устройство</button>
        </div>

        <!-- ШАГ 2: ВЫБОР ВКУСА -->
        <div class="step" id="step-flavor">
            <button class="btn-back" onclick="goBackToDevices()">← Назад к устройствам</button>
            <div class="swiper flavorSwiper">
                <div class="swiper-wrapper" id="flavor-list"></div>
            </div>
            <div class="neon-podium" id="neon-glow"></div>
            <button class="btn-action" onclick="confirmFlavor()">Выбрать вкус</button>
        </div>

        <!-- ШАГ 3: ОФОРМЛЕНИЕ ЗАКАЗА -->
        <div class="step" id="step-order">
            <button class="btn-back" onclick="goBackToFlavors()">← Назад к вкусам</button>
            
            <div class="order-form-container">
                <div class="form-group">
                    <label class="form-label">Введите ваше имя</label>
                    <input type="text" id="cust-name" placeholder="Например, Алексей">
                </div>

                <div class="form-group">
                    <label class="form-label">Номер телефона WhatsApp</label>
                    <div class="phone-input-wrapper">
                        <select id="country-select" class="country-select" onchange="updatePhoneMask()">
                            <option value="KZ" selected>🇰🇿 +7</option>
                            <option value="RU">🇷🇺 +7</option>
                            <option value="KG">🇰🇬 +996</option>
                            <option value="UZ">🇺🇿 +998</option>
                        </select>
                        <input type="tel" id="cust-phone" placeholder="(705) 123-45-67" maxlength="15">
                    </div>
                    <span class="form-hint" id="phone-hint">Курьер свяжется с вами посредством аудиозвонка на WhatsApp.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Адрес доставки</label>
                    <input type="text" id="cust-address" list="locations-list" placeholder="Выберите или введите адрес">
                    <datalist id="locations-list">
                        <option value="пр. Аль-Фараби, г. Костанай">
                        <option value="ул. Байтурсынова, г. Костанай">
                        <option value="ул. Баймагамбетова, г. Костанай">
                        <option value="ул. Пушкина, г. Костанай">
                        <option value="ул. Карбышева, г. Костанай">
                        <option value="пр. Абая, г. Костанай">
                        <option value="мкр. Юбилейный, г. Костанай">
                        <option value="мкр. Аэропорт, г. Костанай">
                        <option value="г. Рудный">
                        <option value="п. Затобольск (Тобыл)">
                        <option value="г. Тобыл">
                    </datalist>
                    <span class="form-hint">Доставка по г. Костанай (акцент), Рудный, Затоболовка, г. Тобыл.</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Комментарий (необязательно)</label>
                    <input type="text" id="cust-comment" placeholder="Подъезд, этаж, домофон">
                </div>

                <div class="payment-notice">
                    💵 Оплата исключительно наличными при получении
                </div>
            </div>

            <button class="btn-action" id="submit-btn" onclick="submitOrder()">Оформить заказ</button>
        </div>

        <!-- ШАГ 4: УСПЕШНЫЙ ЗАКАЗ И ДЕЙСТВИЯ -->
        <div class="step" id="step-success">
            <div class="success-icon">🎉</div>
            <h2 class="success-title">Заказ успешно оформлен!</h2>
            <p class="success-subtitle" id="success-order-id">Заказ #0</p>

            <div class="success-card" id="success-item-card">
                <!-- Карточка купленного товара -->
            </div>

            <div class="success-buttons">
                <button class="btn-action" onclick="resetToCatalog()">Заказать еще устройство</button>
                <button class="btn-secondary" onclick="closeWebApp()">Завершить (Закрыть)</button>
                <button class="btn-danger" id="cancel-request-btn" onclick="requestOrderCancellation()">Попросить об отмене заказа</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const API_BASE_URL = "https://lucky-hound-16.loca.lt";

        const deviceImages = {
            "WAKA soPRO BOOST 20000": "https://raw.githubusercontent.com/maker17707/shop/main/sopro20000.png",
            "PA 10000": "https://raw.githubusercontent.com/maker17707/shop/main/pa10000.png",
            "Slim 8000": "https://raw.githubusercontent.com/maker17707/shop/main/slim8000.png"
        };

        const flavorColors = {
            "КЛУБНИКА, МАЛИНА": "#ff2a6d",
            "ПЕРСИК, МАЛИНА": "#ff7700",
            "ЧЕРНИКА, МАЛИНА, МЕТОЛ": "#7b2cbf",
            "АРБУЗ": "#00ff66",
            "КЛУБНИКА, КИВИ": "#b4ff39",
            "ЕЖЕВИКА, ЧЕРНИКА, МАЛИНА": "#4361ee",
            "КЛУБНИКА, АРБУЗ": "#ff0054",
            "АРБУЗ, ВИШНЯ": "#d90429",
            "САКУРА, ВИНОГРАД": "#9d4edd",
            "КИВИ, МАРАКУЙЯ, ГУАВА": "#ffb703"
        };

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        let catalogData = [];
        let selectedDevice = null;
        let selectedFlavor = null;
        let deviceSwiper = null;
        let flavorSwiper = null;
        let lastCreatedOrderId = null;

        function extractPuffs(name) {
            const match = name.match(/\d+/g);
            if (match) {
                const numbers = match.map(Number);
                const maxNum = Math.max(...numbers);
                if (maxNum > 100) return `${maxNum} затяжек`;
            }
            return "";
        }

        async function loadCatalog() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/catalog`);
                if (!response.ok) throw new Error('Ошибка сервера');
                catalogData = await response.json();
                renderDevices();
            } catch (error) {
                console.error('Не удалось загрузить каталог:', error);
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Ошибка загрузки каталога</div></div>';
            }
        }

        function renderDevices() {
            if (!catalogData.length) {
                document.getElementById('device-list').innerHTML = '<div class="swiper-slide"><div class="loading">Нет товаров в наличии</div></div>';
                return;
            }

            const container = document.getElementById('device-list');
            container.innerHTML = catalogData.map(dev => {
                const imageUrl = deviceImages[dev.name] || 'https://via.placeholder.com/150x170/1a1a24/ffffff?text=' + encodeURIComponent(dev.name);
                const puffsText = extractPuffs(dev.name);
                
                return `
                <div class="swiper-slide">
                    <div class="device-card">
                        <img src="${imageUrl}" alt="${dev.name}">
                        <div class="device-title">${dev.name}</div>
                        ${puffsText ? `<div class="device-puffs">${puffsText}</div>` : ''}
                        <div class="device-price">${dev.price}</div>
                    </div>
                </div>
                `;
            }).join('');

            deviceSwiper = new Swiper('.deviceSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 35, stretch: 0, depth: 160, modifier: 1, slideShadows: false },
                on: { slideChange: () => triggerHaptic() }
            });
        }

        function renderFlavors(flavors) {
            const container = document.getElementById('flavor-list');
            container.innerHTML = flavors.map(fl => {
                const upperName = fl.name.toUpperCase().trim();
                const color = flavorColors[upperName] || '#00f3ff';
                
                return `
                <div class="swiper-slide">
                    <div class="flavor-card" style="background: linear-gradient(135deg, ${color}25, rgba(255,255,255,0.03));">
                        <div class="flavor-name">${fl.name}</div>
                        <div class="flavor-stock">✓ В наличии</div>
                    </div>
                </div>
            `;
            }).join('');

            if (flavorSwiper) flavorSwiper.destroy();

            flavorSwiper = new Swiper('.flavorSwiper', {
                effect: 'coverflow',
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: 'auto',
                coverflowEffect: { rotate: 30, stretch: 0, depth: 120, modifier: 1, slideShadows: false },
                on: {
                    init: function () { updateNeonGlow(flavors[this.activeIndex]); },
                    slideChange: function () {
                        triggerHaptic();
                        updateNeonGlow(flavors[this.activeIndex]);
                    }
                }
            });
        }

        function updateNeonGlow(flavor) {
            if (!flavor) return;
            const podium = document.getElementById('neon-glow');
            const upperName = flavor.name.toUpperCase().trim();
            const color = flavorColors[upperName] || '#00f3ff';
            
            podium.style.setProperty('--neon-color', color);
            podium.style.setProperty('--neon-glow', color + 'cc');
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function confirmDevice() {
            if (!catalogData.length) return;
            selectedDevice = catalogData[deviceSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-device').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
            renderFlavors(selectedDevice.flavors);
        }

        function goBackToDevices() {
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
        }

        function confirmFlavor() {
            selectedFlavor = selectedDevice.flavors[flavorSwiper.activeIndex];
            document.getElementById('step-subtitle').innerText = 'Оформление заказа';
            document.getElementById('step-flavor').classList.remove('active');
            document.getElementById('step-order').classList.add('active');
        }

        function goBackToFlavors() {
            document.getElementById('step-subtitle').innerText = `${selectedDevice.name} — Выберите вкус`;
            document.getElementById('step-order').classList.remove('active');
            document.getElementById('step-flavor').classList.add('active');
        }

        function updatePhoneMask() {
            const country = document.getElementById('country-select').value;
            const phoneInput = document.getElementById('cust-phone');
            
            if (country === 'KZ' || country === 'RU') {
                phoneInput.placeholder = "(705) 123-45-67";
                phoneInput.maxLength = 15;
            } else if (country === 'KG') {
                phoneInput.placeholder = "(500) 123-456";
                phoneInput.maxLength = 14;
            } else if (country === 'UZ') {
                phoneInput.placeholder = "(90) 123-45-67";
                phoneInput.maxLength = 12;
            }
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const rawPhone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const comment = document.getElementById('cust-comment').value.trim();

            if (!name || !rawPhone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес!');
                return;
            }

            const countryCodeSelect = document.getElementById('country-select');
            const selectedCountry = countryCodeSelect ? countryCodeSelect.value : 'KZ';
            let prefix = "+7";
            if (selectedCountry === 'KG') prefix = "+996";
            if (selectedCountry === 'UZ') prefix = "+998";

            const phone = prefix + rawPhone.replace(/[^\d]/g, '');

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            const cleanPrice = parseFloat(selectedDevice.price.replace(/[^\d]/g, '')) || 0;
            const tgUser = tg?.initDataUnsafe?.user;

            const orderData = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                telegram_id: tgUser ? tgUser.id : null,
                username: tgUser?.username || "Не указан",
                items: [
                    {
                        model: selectedDevice.name,
                        flavor: selectedFlavor.name,
                        quantity: 1,
                        selling_price: cleanPrice
                    }
                ],
                total_price: cleanPrice,
                payment_type: "Наличные при получении",
                comment: comment
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    lastCreatedOrderId = result.order_id;

                    document.getElementById('success-order-id').innerText = `Заказ #${lastCreatedOrderId}`;
                    const imageUrl = deviceImages[selectedDevice.name] || 'https://via.placeholder.com/60x70/1a1a24/ffffff?text=Vape';
                    
                    document.getElementById('success-item-card').innerHTML = `
                        <img src="${imageUrl}" alt="${selectedDevice.name}">
                        <div class="success-card-info">
                            <div class="success-card-title">${selectedDevice.name}</div>
                            <div class="success-card-flavor">${selectedFlavor.name}</div>
                            <div class="success-card-price">${selectedDevice.price}</div>
                        </div>
                    `;

                    document.getElementById('step-order').classList.remove('active');
                    document.getElementById('step-success').classList.add('active');
                    document.getElementById('step-subtitle').innerText = 'Заказ оформлен';

                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Оформить заказ';
                } else {
                    alert('Ошибка при оформлении заказа. Попробуйте еще раз.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Оформть заказ';
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка соединения с сервером.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Оформить заказ';
            }
        }

        function resetToCatalog() {
            document.getElementById('step-success').classList.remove('active');
            document.getElementById('step-device').classList.add('active');
            document.getElementById('step-subtitle').innerText = 'Шаг 1: Выберите устройство';
            selectedDevice = null;
            selectedFlavor = null;
            lastCreatedOrderId = null;
            loadCatalog();
        }

        function closeWebApp() {
            if (tg) {
                tg.close();
            } else {
                window.close();
            }
        }

        async function requestOrderCancellation() {
            if (!lastCreatedOrderId) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/orders/cancel-request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: lastCreatedOrderId })
                });

                if (response.ok) {
                    alert('⚠️ Запрос на отмену отправлен администратору.');
                    const btn = document.getElementById('cancel-request-btn');
                    btn.disabled = true;
                    btn.innerText = 'Запрос на отмену отправлен';
                } else {
                    alert('Не удалось отправить запрос.');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения с сервером.');
            }
        }

        loadCatalog();
    </script>
</body>
</html>
