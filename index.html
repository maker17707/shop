<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        h1 { text-align: center; font-size: 22px; }
        .product-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card h3 { margin: 0 0 10px 0; }
        select, input { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #2ea6ff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:active { background: #1a88e0; }
        #cart-section { background: #fff; padding: 15px; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>🛍️ Каталог товаров</h1>
    <div id="catalog-container">Загрузка каталога...</div>

    <div id="cart-section">
        <h3>🛒 Оформление заказа</h3>
        <input type="text" id="cust-name" placeholder="Ваше Имя">
        <input type="text" id="cust-phone" placeholder="Телефон WhatsApp (например, +7700...)">
        <input type="text" id="cust-address" placeholder="Адрес доставки">
        <input type="text" id="cust-comment" placeholder="Комментарий к заказу (необязательно)">
        
        <p><strong>Итого: <span id="total-price">0</span> ₸</strong></p>
        <button onclick="submitOrder()">Отправить заказ</button>
    </div>

    <script>
        const API_URL = "https://rotten-dingos-cross.loca.lt";
        let catalogData = [];
        let cart = []; // Хранит выбранные товары

        async function loadCatalog() {
            try {
                let response = await fetch(`${API_URL}/api/catalog`);
                catalogData = await response.json();
                
                let container = document.getElementById('catalog-container');
                container.innerHTML = '';

                if (catalogData.length === 0) {
                    container.innerHTML = '<p>В данный момент товар закончился.</p>';
                    return;
                }

                catalogData.forEach((item, index) => {
                    let optionsHtml = item.flavors.map(f => `<option value="${f.name}">${f.name} (В наличии: ${f.stock} шт.)</option>`).join('');
                    
                    let card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <h3>${item.name}</h3>
                        <p>Цена: <strong>${item.price}</strong></p>
                        <label>Выберите вкус:</label>
                        <select id="flavor-${index}">${optionsHtml}</select>
                        <label>Количество:</label>
                        <input type="number" id="qty-${index}" value="1" min="1" max="10">
                        <button onclick="addToCart('${item.name}', ${index}, '${item.price}')">Добавить в корзину</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('catalog-container').innerText = 'Ошибка загрузки каталога с сервера.';
            }
        }

        function addToCart(modelName, index, priceStr) {
            let flavorSelect = document.getElementById(`flavor-${index}`);
            let qtyInput = document.getElementById(`qty-${index}`);
            
            let flavor = flavorSelect.value;
            let quantity = parseInt(qtyInput.value);
            let numericPrice = parseFloat(priceStr.replace(/[^0-9]/g, ''));

            cart.push({
                model: modelName,
                flavor: flavor,
                quantity: quantity,
                selling_price: numericPrice
            });

            alert(`Добавлено в корзину: ${modelName} (${flavor}) — ${quantity} шт.`);
            updateTotal();
        }

        function updateTotal() {
            let total = cart.reduce((sum, item) => sum + (item.selling_price * item.quantity), 0);
            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        async function submitOrder() {
            if (cart.length === 0) {
                alert('Ваша корзина пуста!');
                return;
            }

            let name = document.getElementById('cust-name').value.trim();
            let phone = document.getElementById('cust-phone').value.trim();
            let address = document.getElementById('cust-address').value.trim();
            let comment = document.getElementById('cust-comment').value.trim();

            if (!name || !phone || !address) {
                alert('Пожалуйста, заполните имя, телефон и адрес!');
                return;
            }

            let total = cart.reduce((sum, item) => sum + (item.selling_price * item.quantity), 0);

            let orderPayload = {
                customer_name: name,
                whatsapp_phone: phone,
                address: address,
                items: cart,
                total_price: total,
                payment_type: "Наличные/Перевод",
                comment: comment
            };

            try {
                let response = await fetch(`${API_URL}/api/orders/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                
                let result = await response.json();
                if (response.ok) {
                    alert('🎉 Заказ успешно оформлен!');
                    cart = [];
                    updateTotal();
                    // Если открыто в Телеграме, закрываем WebApp
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.close();
                    }
                } else {
                    alert('Ошибка сервера: ' + result.detail);
                }
            } catch (err) {
                console.error(err);
                alert('Не удалось отправить заказ. Проверьте соединение с сервером.');
            }
        }

        loadCatalog();
    </script>
</body>
</html>
