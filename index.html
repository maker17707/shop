<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Razki_bot — Заказ устройств</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #121214;
            --tg-theme-text-color: #f3f3f6;
            --tg-theme-hint-color: #8e8e93;
            --tg-theme-button-color: #6c5ce7;
            --tg-theme-button-text-color: #ffffff;
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color);
            padding: 16px;
            padding-bottom: 90px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1, h2 {
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        h1 { font-size: 22px; color: #fff; }
        h2 { font-size: 18px; color: var(--tg-theme-hint-color); margin-top: 20px; }

        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* 3D Drum / Wheel Selector for Flavors */
        .wheel-wrapper {
            position: relative;
            height: 180px;
            perspective: 1000px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gradient Fades for Depth */
        .wheel-wrapper::before,
        .wheel-wrapper::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 55px;
            z-index: 5;
            pointer-events: none;
        }
        .wheel-wrapper::before {
            top: 0;
            background: linear-gradient(to bottom, var(--card-bg), rgba(26, 26, 30, 0));
        }
        .wheel-wrapper::after {
            bottom: 0;
            background: linear-gradient(to top, var(--card-bg), rgba(26, 26, 30, 0));
        }

        /* Center selection indicator highlight */
        .wheel-indicator {
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            transform: translateY(-50%);
            height: 42px;
            background: rgba(108, 92, 231, 0.12);
            border-top: 1px solid var(--accent);
            border-bottom: 1px solid var(--accent);
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
        }

        .wheel-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 70px 0;
            position: relative;
            z-index: 3;
            text-align: center;
        }
        .wheel-container::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-size: 15px;
            color: var(--tg-theme-hint-color);
            opacity: 0.4;
            transform: scale(0.85);
            filter: blur(1px);
            transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            user-select: none;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .wheel-item.active {
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        /* Form elements */
        input, select, textarea {
            width: 100%;
            background: #121214;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            margin-top: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 16px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        
        /* Catalog grid */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .catalog-item {
            background: #222228;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .catalog-item.selected {
            border-color: var(--accent);
            background: rgba(108, 92, 231, 0.1);
        }
        .catalog-item h3 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #fff;
        }
        .catalog-item p {
            font-size: 13px;
            color: var(--tg-theme-hint-color);
        }
    </style>
</head>
<body>

    <h1>Razki_bot Store</h1>
    
    <!-- Каталог устройств -->
    <div class="section">
        <h2>Выберите модель</h2>
        <div class="catalog-grid" id="catalogGrid">
            <!-- Динамически заполняется -->
        </div>
    </div>

    <!-- Блок выбора вкусов с 3D-барабаном -->
    <div class="section" id="flavorSection" style="display:none;">
        <h2>Выберите вкус</h2>
        <div class="wheel-wrapper">
            <div class="wheel-indicator"></div>
            <div class="wheel-container" id="wheelContainer">
                <!-- Вкусы подгружаются динамически -->
            </div>
        </div>
    </div>

    <!-- Форма заказа -->
    <div class="section" id="orderSection" style="display:none;">
        <h2>Оформление заказа</h2>
        <form id="orderForm">
            <label>Имя получателя</label>
            <input type="text" id="nameInput" placeholder="Ваше имя" required>

            <label style="margin-top: 12px; display:block;">Телефон (WhatsApp)</label>
            <input type="tel" id="phoneInput" placeholder="+7 (___) ___-__-__" required>

            <label style="margin-top: 12px; display:block;">Адрес доставки</label>
            <input type="text" id="addressInput" placeholder="Улица, дом, квартира" required>

            <button type="submit" class="btn">Подтвердить заказ</button>
        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Данные каталога (или подгрузка с /api/catalog)
        const catalogData = [
            { id: 'soPRO-20000', name: 'soPRO 20000', price: '6500 ₸', flavors: ['Мхохито', 'Клубничный лед', 'Арбузная жвачка', 'Двойное яблоко', 'Виноградный энергетик', 'Лесные ягоды'] },
            { id: 'PA-10000', name: 'PA 10000', price: '4800 ₸', flavors: ['Черника малина', 'Манго персик', 'Кока-кола', 'Холодная мята', 'Банановый смузи'] },
            { id: 'SLIM-8000', name: 'SLIM 8000', price: '4000 ₸', flavors: ['Киви маракуйя', 'Ананас кокос', 'Вишня лед', 'Энергетик'] }
        ];

        let selectedDevice = null;
        let selectedFlavor = null;

        const catalogGrid = document.getElementById('catalogGrid');
        const flavorSection = document.getElementById('flavorSection');
        const wheelContainer = document.getElementById('wheelContainer');
        const orderSection = document.getElementById('orderSection');

        function renderCatalog() {
            catalogGrid.innerHTML = '';
            catalogData.forEach(device => {
                const div = document.createElement('div');
                div.className = `catalog-item ${selectedDevice?.id === device.id ? 'selected' : ''}`;
                div.innerHTML = `<h3>${device.name}</h3><p>${device.price}</p>`;
                div.onclick = () => selectDevice(device);
                catalogGrid.appendChild(div);
            });
        }

        function selectDevice(device) {
            selectedDevice = device;
            renderCatalog();
            flavorSection.style.display = 'block';
            renderWheel(device.flavors);
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function renderWheel(flavors) {
            wheelContainer.innerHTML = '';

            flavors.forEach((flavor, index) => {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.textContent = flavor;
                item.dataset.index = index;
                item.onclick = () => {
                    wheelContainer.scrollTo({
                        top: index * 42,
                        behavior: 'smooth'
                    });
                };
                wheelContainer.appendChild(item);
            });

            selectedFlavor = flavors[0];
            updateWheelActiveState();
        }

        function updateWheelActiveState() {
            const scrollTop = wheelContainer.scrollTop;
            const itemHeight = 42;
            const index = Math.round(scrollTop / itemHeight);
            
            const items = wheelContainer.querySelectorAll('.wheel-item');
            items.forEach((item, idx) => {
                if (idx === index) {
                    item.classList.add('active');
                    selectedFlavor = item.textContent;
                } else {
                    item.classList.remove('active');
                }
            });
        }

        wheelContainer.addEventListener('scroll', () => {
            updateWheelActiveState();
        });

        wheelContainer.addEventListener('touchend', () => {
            setTimeout(() => {
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                orderSection.style.display = 'block';
            }, 100);
        });

        // Автозаполнение имени из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('nameInput').value = tg.initDataUnsafe.user.first_name || '';
        }

        // Отправка формы на сервер
        document.getElementById('orderForm').onsubmit = (e) => {
            e.preventDefault();
            const orderData = {
                device: selectedDevice.name,
                price: selectedDevice.price,
                flavor: selectedFlavor,
                name: document.getElementById('nameInput').value,
                phone: document.getElementById('phoneInput').value,
                address: document.getElementById('addressInput').value
            };

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            fetch('/api/orders/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            }).then(() => {
                tg.close();
            }).catch(() => {
                alert('Заказ успешно создан!');
                tg.close();
            });
        };

        renderCatalog();
    </script>
</body>
</html>
